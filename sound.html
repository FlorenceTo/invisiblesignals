<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Band Test – Independent Toggle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        body { background: black; font-family: monospace; margin: 20px; color: #9afc97; }
        button { background: #222; border: 1px solid #ff4444; border-radius: 40px; padding: 8px 16px; margin: 5px; color: #ff8888; cursor: pointer; }
        button.active { background: #9afc9722; border-color: #9afc97; color: #9afc97; }
        .status { position: fixed; bottom: 20px; left: 20px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="bandButtons"></div>
    <div class="status" id="status">Click any band button to start audio. Then toggle.</div>

<script>
    // ============================================
    // MINIMAL TEST: Each band has its own noise,
    // filter and gain. Toggle on/off.
    // ============================================

    let bandIds = ['cband', 'kuband', 'lband', 'kaband', 'xband'];
    let bandFreqs = {
        cband: 600,
        kuband: 1800,
        lband: 350,
        kaband: 5000,
        xband: 1000
    };
    let bandActive = {
        cband: true,
        kuband: false,
        lband: false,
        kaband: false,
        xband: false
    };
    let bandNoises = {};
    let bandGains = {};
    let masterGain;
    let radioStarted = false;

    function setup() {
        createCanvas(100, 100); // minimal canvas to satisfy p5
        noCanvas(); // we don't need drawing

        // Master gain – quiet
        masterGain = new p5.Gain();
        masterGain.amp(0.15);
        masterGain.connect();

        // Create each band
        for (let band of bandIds) {
            let noise = new p5.Noise('brown');
            noise.amp(0.3);
            let bp = new p5.BandPass();
            bp.freq(bandFreqs[band]);
            bp.res(6);
            let gain = new p5.Gain();
            noise.connect(bp);
            bp.connect(gain);
            gain.connect(masterGain);
            gain.amp(bandActive[band] ? 1.0 : 0.0);
            bandNoises[band] = noise;
            bandGains[band] = gain;
        }

        // Create UI buttons
        let container = select('#bandButtons');
        for (let band of bandIds) {
            let btn = createButton(`${band.toUpperCase()} (${bandFreqs[band]} Hz)`);
            btn.parent(container);
            btn.addClass('band-btn');
            if (bandActive[band]) btn.addClass('active');
            btn.mousePressed(() => toggleBand(band));
            btn.touchStarted(() => { toggleBand(band); return false; });
        }
    }

    function toggleBand(band) {
        // Ensure audio context started on first user gesture
        if (!radioStarted) {
            userStartAudio().then(() => {
                radioStarted = true;
                for (let b of bandIds) bandNoises[b].start();
                doToggle(band);
            }).catch(() => {});
        } else {
            doToggle(band);
        }
    }

    function doToggle(band) {
        bandActive[band] = !bandActive[band];
        bandGains[band].amp(bandActive[band] ? 1.0 : 0.0);
        let btns = selectAll('.band-btn');
        for (let i = 0; i < btns.length; i++) {
            let btn = btns[i];
            let btnBand = btn.html().split(' ')[0].toLowerCase();
            if (btnBand === band) {
                if (bandActive[band]) btn.addClass('active');
                else btn.removeClass('active');
            }
        }
        let activeCount = Object.values(bandActive).filter(v => v).length;
        select('#status').html(`Active bands: ${activeCount}. Audio started? ${radioStarted}`);
    }
</script>
</body>
</html>
