<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Radio Signal Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: pan-x pan-y;
        }
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 60px;
            pointer-events: auto;
            font-family: monospace;
        }
        .band-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .band-btn {
            background: rgba(30,30,40,0.8);
            border: 1px solid #ff4444;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff8888;
            cursor: pointer;
            transition: 0.1s;
        }
        .band-btn.active {
            background: #9afc9722;
            border-color: #9afc97;
            color: #9afc97;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
        }
        .volume-control span {
            font-size: 11px;
            color: #ffffff;
            font-family: monospace;
        }
        input[type="range"] {
            width: 90px;
            background: #ffffff;
            height: 3px;
            border-radius: 3px;
            -webkit-appearance: none;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }
        .fail-counter {
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff0000;
            border: 1px solid #ff0000;
            white-space: nowrap;
        }
        .back-link {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            border: 1px solid #9afc97;
            transition: 0.2s;
        }
        .instruction {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        .startup-message {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 40px;
            color: #ffffff;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #ffffff;
            max-width: 85%;
            transition: opacity 1s ease;
            white-space: nowrap;
        }
        @media (max-width: 640px) {
            .band-btn { font-size: 9px; padding: 4px 8px; }
            .volume-control input { width: 70px; }
            .fail-counter { font-size: 9px; padding: 4px 8px; }
            .startup-message { font-size: 11px; white-space: normal; width: 90%; padding: 12px 16px; top: 20%; }
        }
        @media (max-width: 480px) {
            .startup-message { font-size: 10px; top: 18%; }
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="band-buttons" id="bandButtons">
        <button class="band-btn active" data-band="cband">C‑band (600 Hz)</button>
        <button class="band-btn" data-band="kuband">Ku‑band (1800 Hz)</button>
        <button class="band-btn" data-band="lband">L‑band (350 Hz)</button>
        <button class="band-btn" data-band="kaband">Ka‑band (5000 Hz)</button>
        <button class="band-btn" data-band="xband">X‑band (1000 Hz)</button>
    </div>
    <div class="volume-control">
        <span>radio vol</span>
        <input type="range" id="radioVolume" min="0" max="1" step="0.01" value="1.0">
    </div>
    <div class="fail-counter" id="failCounter">failures 0/18</div>
</div>
<a href="index.html" class="back-link">← radio</a>
<div class="instruction">press keys 1 2 3 4 5 6 7 → match dots</div>
<div id="startupMsg" class="startup-message">Use Firefox browser for best experience<br>press 1 to start</div>

<script>
    // ================================================================
    // CLEAN RADIO GAME – background bands low volume (25%),
    // number tones full volume, independent toggles,
    // stacked waveforms for all active bands.
    // ================================================================

    let shapes = [];
    let ripples = [];
    let reverb, melodicFilter;
    
    // Feedback frequencies (raised 5 semitones)
    const baseFeedbackFreqs = [110.00, 123.75, 132.00, 137.50, 146.67, 154.66, 165.00];
    const feedbackFreqs = baseFeedbackFreqs.map(f => f * 1.33483985417);
    
    // Radio background – low volume (25% of user slider)
    let radioNoise;
    let bandFilters = {};     // BandPass per band
    let bandGains = {};       // Gain per band
    let radioMasterGain;      // overall radio gain (fixed 0.25)
    let userRadioGain;        // slider gain (0-1)
    let radioStarted = false;
    
    // Band state and frequencies
    const bands = {
        cband: { freq: 600, active: true, color: [154,252,151] },
        kuband: { freq: 1800, active: false, color: [154,252,151] },
        lband: { freq: 350, active: false, color: [154,252,151] },
        kaband: { freq: 5000, active: false, color: [154,252,151] },
        xband: { freq: 1000, active: false, color: [154,252,151] }
    };
    
    // Waveform storage for each band (multiple layers)
    let wavePointsMap = {};   // each band stores its own array of points
    
    // Game state
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let feedbackTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;
    let baseDelay = 1500;
    let currentDelay = 1500;
    
    let failCounterDiv;
    let startupMsgDiv;
    let radioSlider;
    
    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);
        
        // Reverb for number tones (full volume)
        reverb = new p5.Reverb();
        reverb.set(5, 3);
        melodicFilter = new p5.LowPass();
        melodicFilter.freq(2200);
        
        // Radio noise source
        radioNoise = new p5.Noise('brown');
        radioNoise.amp(0.51);   // base noise level (15% quieter than before)
        
        // Master gain for radio background (fixed 25%)
        radioMasterGain = new p5.Gain();
        radioMasterGain.amp(0.25);
        userRadioGain = new p5.Gain();
        userRadioGain.amp(1.0);   // slider will adjust this
        
        // Create per‑band filter and gain
        for (let [band, info] of Object.entries(bands)) {
            let bp = new p5.BandPass();
            bp.freq(info.freq);
            bp.res(6);
            let gain = new p5.Gain();
            radioNoise.connect(bp);
            bp.connect(gain);
            gain.connect(userRadioGain);
            bandFilters[band] = bp;
            bandGains[band] = gain;
            gain.amp(info.active ? 1.0 : 0.0);  // on/off (later multiplied by master)
            // prepare waveform points for this band
            wavePointsMap[band] = [];
            for (let i = 0; i <= width; i += 8) {
                wavePointsMap[band].push({x: i, y: height/2});
            }
        }
        userRadioGain.connect(radioMasterGain);
        radioMasterGain.connect();
        
        // Volume slider (controls only radio background)
        radioSlider = select('#radioVolume');
        radioSlider.input(() => {
            let val = parseFloat(radioSlider.value());
            userRadioGain.amp(val);
        });
        
        // Band buttons: simple on/off toggle
        let bandBtns = selectAll('.band-btn');
        for (let btn of bandBtns) {
            btn.mousePressed(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
            });
            btn.touchStarted(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
                return false;
            });
        }
        
        failCounterDiv = select('#failCounter');
        updateFailDisplay();
        startupMsgDiv = select('#startupMsg');
        
        background(0);
    }
    
    function toggleBand(band) {
        bands[band].active = !bands[band].active;
        let btn = select(`.band-btn[data-band="${band}"]`);
        if (bands[band].active) {
            bandGains[band].amp(1.0);
            btn.addClass('active');
            btn.removeClass('muted');
        } else {
            bandGains[band].amp(0);
            btn.removeClass('active');
            btn.addClass('muted');
        }
        // No "all‑on" or solo mode – each band independent
    }
    
    function startRadioBackground() {
        if (radioStarted) return;
        radioStarted = true;
        radioNoise.start();
        // initial gains already set
    }
    
    function dismissStartupMessage() {
        if (startupMsgDiv && startupMsgDiv.elt) {
            startupMsgDiv.style('opacity', '0');
            setTimeout(() => {
                if (startupMsgDiv && startupMsgDiv.elt) startupMsgDiv.remove();
            }, 1000);
        }
    }
    
    // ---------- Multiple waveform drawing (all active bands) ----------
    function drawAllWaveforms() {
        let time = frameCount;
        for (let [band, info] of Object.entries(bands)) {
            if (!info.active) continue;
            let freq = info.freq;
            let amplitude = 40 + 10 * sin(time * 0.015);
            let phase = time * (freq / 1800.0);
            let points = wavePointsMap[band];
            for (let i = 0; i < points.length; i++) {
                let x = points[i].x;
                let y = height/2 + sin(x * freq / 7000.0 + phase) * amplitude + cos(x * freq / 11000.0) * (amplitude * 0.5);
                points[i].y = y;
            }
            
            // Draw waveform for this band (semi‑transparent green, 0.6 opacity)
            stroke(154, 252, 151, 100);
            strokeWeight(1.0);
            noFill();
            beginShape();
            for (let p of points) vertex(p.x, p.y);
            endShape();
        }
        
        // Also draw floating white particles (non‑band specific)
        stroke(255, 180);
        strokeWeight(1);
        for (let i = 0; i < 40; i++) {
            let x = (frameCount * 0.8 + i * 70) % width;
            let y = height/2 + sin(x * 0.01 + frameCount * 0.05) * 30;
            point(x, y);
        }
        
        // Display current active bands count (optional)
        let activeCount = Object.values(bands).filter(b => b.active).length;
        fill(200, 200, 200, 150);
        noStroke();
        textAlign(LEFT, TOP);
        textSize(10);
        textFont('monospace');
        text(`active bands: ${activeCount}`, 15, 65);
    }
    
    // ---------- Musical feedback (full volume, reduced chorus) ----------
    function playFeedbackTone(num) {
        let baseFreq = feedbackFreqs[num-1];
        if (!baseFreq) return;
        addFrequencyRipple(baseFreq);
        
        let volumeBoost = 1.35;   // full volume
        let env = new p5.Envelope();
        env.setADSR(0.02, 0.15, 0.6, 1.2);
        env.setRange(0.28 * volumeBoost, 0);
        
        // Reduced chorus intensity (20% less: cents 0, ±5 instead of ±7)
        let detunes = [0, 5, -5];
        let voices = [];
        for (let i = 0; i < detunes.length; i++) {
            let osc = new p5.Oscillator('sine');
            let cents = detunes[i];
            let freq = baseFreq * Math.pow(2, cents / 1200);
            osc.freq(freq);
            osc.start();
            env.play(osc);
            osc.disconnect();
            osc.connect(melodicFilter);
            voices.push(osc);
        }
        
        melodicFilter.disconnect();
        melodicFilter.connect(reverb);
        reverb.process(melodicFilter, 3.5, 2.5);
        
        let ampObj = new p5.Amplitude();
        ampObj.setInput(voices[0]);
        
        shapes.push({
            x: random(width),
            y: random(height),
            vx: random(-1.8, 1.8),
            vy: random(-2.2, -0.5),
            osc: voices[0],
            amp: ampObj,
            opacity: 200,
            extraOscs: voices.slice(1)
        });
        
        setTimeout(() => {
            for (let v of voices) v.stop();
            let idx = shapes.findIndex(s => s.osc === voices[0]);
            if (idx !== -1) shapes.splice(idx,1);
        }, 1800);
    }
    
    function addFrequencyRipple(noteFreq) {
        let ripple = {
            x: width/2,
            y: height/2,
            radius: 20,
            maxRadius: min(width,height) * 0.7,
            life: 255,
            freq: noteFreq
        };
        ripples.push(ripple);
    }
    
    function drawRipples() {
        for (let i = ripples.length-1; i >= 0; i--) {
            let r = ripples[i];
            r.radius += 5;
            r.life -= 6;
            if (r.radius > r.maxRadius || r.life <= 0) {
                ripples.splice(i,1);
                continue;
            }
            noFill();
            stroke(154,252,151, r.life);
            strokeWeight(1.2);
            circle(r.x, r.y, r.radius * 2);
            let innerRadius = r.radius * (r.freq / 350);
            stroke(255, 200, 100, r.life * 0.6);
            circle(r.x, r.y, innerRadius * 2);
        }
    }
    
    // Game logic
    function updateSpeed() {
        currentDelay = max(320, baseDelay - (speedLevel * 55));
    }
    
    function nextRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
    }
    
    function onCorrect() {
        playFeedbackTone(currentTarget);
        correctFlash = 110;
        waitingForInput = false;
        if (speedLevel < 18) speedLevel++;
        updateSpeed();
        if (feedbackTimer) clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
            if (gameActive) nextRound();
            feedbackTimer = null;
        }, currentDelay);
    }
    
    function onWrong() {
        failCount++;
        updateFailDisplay();
        correctFlash = 70;
        if (failCount >= 18) {
            gameOver();
            return;
        }
        waitingForInput = true;
    }
    
    function gameOver() {
        gameActive = false;
        waitingForInput = false;
        if (feedbackTimer) clearTimeout(feedbackTimer);
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.3);
            if (s.extraOscs) for (let o of s.extraOscs) o.amp(0,0.3);
        }
        shapes = [];
        ripples = [];
        failCounterDiv.html("failures 18/18 · lost");
    }
    
    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.3);
        }
        shapes = [];
        ripples = [];
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (feedbackTimer) clearTimeout(feedbackTimer);
    }
    
    function updateFailDisplay() {
        failCounterDiv.html("failures " + failCount + "/18");
    }
    
    function draw() {
        background(0);
        drawAllWaveforms();
        drawRipples();
        
        // Draw floating circles from number presses
        for (let i = shapes.length-1; i >= 0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;
            let level = s.amp.getLevel();
            let ampScale = map(level, 0, 0.3, 0.6, 1.6);
            stroke(255);
            strokeWeight(1.3);
            fill(0, 0);
            circle(s.x, s.y, 24 * ampScale);
            noStroke();
            s.opacity -= 1.5;
            if (s.opacity <= 0) {
                if (s.osc) s.osc.amp(0, 0.8);
                shapes.splice(i,1);
            }
        }
        
        drawTargetDots();
        
        if (correctFlash > 0) {
            fill(255, 255, 255, correctFlash * 0.25);
            rect(0, 0, width, height);
            correctFlash -= 6;
        }
        
        if (!gameActive) {
            fill(255, 255, 255);
            textAlign(CENTER, CENTER);
            textSize(20);
            textFont('monospace');
            text("signal lost", width/2, height/2);
        }
    }
    
    function drawTargetDots() {
        if (!gameActive) return;
        let dotDiameter = 28;
        let spacing = 50;
        let total = currentTarget;
        let startX = width/2 - (total-1) * spacing / 2;
        let yPos = height/2;
        for (let i = 0; i < total; i++) {
            fill(255, 220);
            noStroke();
            circle(startX + i * spacing, yPos, dotDiameter);
            fill(255, 80);
            circle(startX + i * spacing, yPos, dotDiameter * 0.3);
        }
        fill(160, 160, 160, 200);
        textSize(10);
        textAlign(CENTER, BOTTOM);
        textFont('monospace');
        text("speed: " + (speedLevel + 1), width/2, height/2 - 48);
    }
    
    function handleNumberPress(num) {
        dismissStartupMessage();
        userStartAudio().then(() => {
            if (!radioStarted) startRadioBackground();
        }).catch(() => { if (!radioStarted) startRadioBackground(); });
        if (!radioStarted) startRadioBackground();
        
        if (!gameActive) {
            startGame();
            setTimeout(() => {
                if (gameActive && waitingForInput) {
                    if (num === currentTarget) onCorrect();
                    else onWrong();
                }
            }, 50);
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) onCorrect();
        else onWrong();
    }
    
    function keyPressed() {
        let k = key;
        if (['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        if (!gameActive && ['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        return false;
    }
    
    function touchStarted() {
        userStartAudio().catch(()=>{});
        return false;
    }
    
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
        // re‑initialize waveform points for each band
        for (let [band, points] of Object.entries(wavePointsMap)) {
            let newPoints = [];
            for (let i = 0; i <= width; i += 8) {
                newPoints.push({x: i, y: height/2});
            }
            wavePointsMap[band] = newPoints;
        }
    }
</script>
</body>
</html>
