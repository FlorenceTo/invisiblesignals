<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Invisible Signals | Wave Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: pan-x pan-y;
        }
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 60px;
            pointer-events: auto;
            font-family: monospace;
        }
        .band-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .band-btn {
            background: rgba(30,30,40,0.8);
            border: 1px solid #ff4444;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff8888;
            cursor: pointer;
            transition: 0.1s;
        }
        .band-btn.active {
            background: #9afc9722;
            border-color: #9afc97;
            color: #9afc97;
        }
        .score-level {
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #9afc97;
            border: 1px solid #9afc97;
            white-space: nowrap;
        }
        .fail-counter {
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff0000;
            border: 1px solid #ff0000;
            white-space: nowrap;
        }
        .back-link {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: transparent;
            padding: 6px 0;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            transition: opacity 0.2s;
        }
        .instruction {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        .startup-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            padding: 16px 24px;
            color: #ffffff;
            font-family: monospace;
            font-size: 16px;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
            border: none;
            text-shadow: none;
        }
        @media (max-width: 640px) {
            .band-btn { font-size: 9px; padding: 4px 8px; }
            .score-level, .fail-counter { font-size: 9px; padding: 4px 8px; }
            .startup-message { font-size: 14px; white-space: normal; width: 90%; }
        }
        @media (max-width: 480px) {
            .startup-message { font-size: 12px; }
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="band-buttons" id="bandButtons">
        <button class="band-btn" data-band="c">C (261 Hz)</button>
        <button class="band-btn" data-band="db">D♭ (277 Hz)</button>
        <button class="band-btn" data-band="e">E (329 Hz)</button>
        <button class="band-btn" data-band="f">F♯ (369 Hz)</button>
        <button class="band-btn" data-band="g">G♯ (415 Hz)</button>
        <button class="band-btn" data-band="a">A♯ (466 Hz)</button>
        <button class="band-btn" data-band="b">B (493 Hz)</button>
    </div>
    <div class="score-level" id="scoreLevel">0</div>
    <div class="fail-counter" id="failCounter">0/18</div>
</div>
<a href="/" class="back-link">← radio</a>
<div class="instruction">press 1‑7 to match dots</div>
<div id="startupMsg" class="startup-message">press 1 to begin</div>

<script>
    // ================================================================
    // MOBILE DETECTION – show message and disable game on mobile
    // ================================================================
    function isMobileDevice() {
        return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    if (isMobileDevice()) {
        document.body.innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:black; display:flex; align-items:center; justify-content:center; z-index:1000; font-family:monospace; padding:20px;">
                <div style="background:rgba(0,0,0,0.9); border:1px solid #9afc97; border-radius:24px; padding:24px; max-width:90%; text-align:center; color:#9afc97;">
                    This game is designed for desktop browsers.<br><br>Please visit on a computer.
                    <br><br><a href="/" style="color:#9afc97; text-decoration:underline;">← back to radio</a>
                </div>
            </div>
        `;
        throw new Error("Game blocked on mobile");
    }

    // ================================================================
    // GAME CODE (desktop only)
    // ================================================================
    let audioStarted = false;
    let reverb;

    // Dotted wave fade control
    let dottedWaveAlpha = 255;
    let dottedWaveFadeOut = false;
    let fadeStartTime = 0;

    const noteFreqs = {
        1: 261.63, 2: 277.18, 3: 329.63, 4: 369.99, 5: 415.30, 6: 466.16, 7: 493.88
    };
    const numberToBand = { 1:'c', 2:'db', 3:'e', 4:'f', 5:'g', 6:'a', 7:'b' };
    const bandFreqs = {
        c: 261.63, db: 277.18, e: 329.63, f: 369.99, g: 415.30, a: 466.16, b: 493.88
    };
    let bandActive = {
        c: false, db: false, e: false, f: false, g: false, a: false, b: false
    };
    let bandPulse = { c:0, db:0, e:0, f:0, g:0, a:0, b:0 };
    let bandNames = ['c', 'db', 'e', 'f', 'g', 'a', 'b'];
    let wavePoints = {};

    // Game state
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let roundTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let correctCount = 0;
    let pingPongMode = false;
    let dotOffset = 0;
    let dotSpeed = 2;
    let baseDelay = 1500;
    let currentDelay = 1500;

    let scoreLevelDiv, failCounterDiv, startupMsgDiv;

    function setup() {
        pixelDensity(1);
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);

        reverb = new p5.Reverb();
        reverb.set(3, 2);

        for (let band of bandNames) {
            wavePoints[band] = [];
            for (let i = 0; i <= width; i += 8) {
                wavePoints[band].push({x: i, y: height/2});
            }
        }

        let btns = selectAll('.band-btn');
        for (let btn of btns) {
            let band = btn.attribute('data-band');
            btn.mousePressed(() => toggleBand(band));
            btn.touchStarted(() => { toggleBand(band); return false; });
            btn.addClass('muted');
        }

        scoreLevelDiv = select('#scoreLevel');
        failCounterDiv = select('#failCounter');
        startupMsgDiv = select('#startupMsg');
        updateUI();
        background(0);
    }

    function toggleBand(band) {
        if (!gameActive && audioStarted) return;
        bandActive[band] = !bandActive[band];
        let btn = select(`.band-btn[data-band="${band}"]`);
        if (bandActive[band]) {
            btn.addClass('active');
            btn.removeClass('muted');
        } else {
            btn.removeClass('active');
            btn.addClass('muted');
        }
    }

    function activateAllBands() {
        for (let band of bandNames) {
            if (!bandActive[band]) {
                bandActive[band] = true;
                let btn = select(`.band-btn[data-band="${band}"]`);
                btn.addClass('active');
                btn.removeClass('muted');
            }
        }
    }

    function resetAllBandsOff() {
        for (let band of bandNames) {
            bandActive[band] = false;
            let btn = select(`.band-btn[data-band="${band}"]`);
            btn.removeClass('active');
            btn.addClass('muted');
        }
    }

    function startAudio() {
        if (audioStarted) return;
        userStartAudio().then(() => {
            audioStarted = true;
        }).catch(e => console.log(e));
    }

    function dismissStartupMessage() {
        if (startupMsgDiv && startupMsgDiv.elt) {
            startupMsgDiv.style('opacity', '0');
            setTimeout(() => startupMsgDiv.remove(), 500);
        }
    }

    function updateUI() {
        scoreLevelDiv.html(`${correctCount}`);
        failCounterDiv.html(`${failCount}/18`);
    }

    function pulseBand(bandId) {
        bandPulse[bandId] = 1.0;
    }

    function playNote(num, isCorrect) {
        let freq = noteFreqs[num];
        if (!freq) return;
        let env = new p5.Envelope();
        if (isCorrect) {
            env.setADSR(0.01, 0.1, 0.4, 0.3);
            env.setRange(0.2, 0);
        } else {
            env.setADSR(0.01, 0.1, 0.3, 0.2);
            env.setRange(0.15, 0);
        }
        let osc = new p5.Oscillator(isCorrect ? 'sine' : 'triangle');
        osc.freq(freq);
        osc.start();
        env.play(osc);
        osc.disconnect();
        osc.connect(reverb);
        setTimeout(() => { osc.stop(); }, 500);
    }

    function drawWaveforms() {
        let t = frameCount;
        for (let band of bandNames) {
            if (!bandActive[band]) continue;
            let freq = bandFreqs[band];
            let amplitude = 35 + 8 * sin(t * 0.015);
            let pulseFactor = bandPulse[band];
            let phase = t * (freq / 1800.0);
            let points = wavePoints[band];
            for (let i = 0; i < points.length; i++) {
                let x = points[i].x;
                let y = height/2 + sin(x * freq / 7000.0 + phase) * (amplitude + 20 * pulseFactor)
                                + cos(x * freq / 11000.0) * ((amplitude + 20 * pulseFactor) * 0.5);
                points[i].y = y;
            }
            let alphaBase = 100 + (pulseFactor > 0 ? 150 : 0);
            stroke(160, 252, 151, constrain(alphaBase, 0, 255));
            strokeWeight(pulseFactor > 0 ? 1.2 : 0.4);
            noFill();
            beginShape();
            for (let p of points) vertex(p.x, p.y);
            endShape();
            if (bandPulse[band] > 0) bandPulse[band] *= 0.92;
        }

        // ----- SINGULAR DOTTED WAVEFORM (fades out on game start, reappears on game over) -----
        if (dottedWaveAlpha > 0) {
            stroke(255, dottedWaveAlpha);
            strokeWeight(2);
            let step = 15;
            for (let x = 0; x <= width; x += step) {
                let y = height/2 + sin(x * 0.012 + t * 0.03) * 35;
                point(x, y);
            }
        }

        // Active bands counter
        let activeCount = bandNames.filter(b => bandActive[b]).length;
        fill(200,200,200,150);
        noStroke();
        textAlign(LEFT, TOP);
        textSize(10);
        textFont('monospace');
        text(`active waves: ${activeCount}`, 15, 65);
    }

    function drawTargetDots() {
        if (!gameActive) return;
        let dia = 28, baseSpacing = 50, total = currentTarget;
        let maxOffset = 60;
        if (pingPongMode) {
            dotOffset += dotSpeed;
            if (dotOffset > maxOffset || dotOffset < -maxOffset) dotSpeed *= -1;
        }
        let startX = width/2 - (total-1)*baseSpacing/2 + dotOffset;
        for (let i=0; i<total; i++) {
            fill(255,220);
            noStroke();
            circle(startX + i*baseSpacing, height/2, dia);
            fill(255,80);
            circle(startX + i*baseSpacing, height/2, dia*0.3);
        }
        fill(160,160,160,200);
        textSize(10);
        textAlign(CENTER,CENTER);
        textFont('monospace');
        text(`speed: ${speedLevel+1} | ${pingPongMode ? 'ping pong' : 'static'}`, width/2, height/2 - 90);
    }

    function newRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
    }

    function correct(num) {
        playNote(num, true);
        let band = numberToBand[num];
        if (band) pulseBand(band);
        correctFlash = 110;
        waitingForInput = false;
        correctCount++;
        if (correctCount >= 5 && !pingPongMode) pingPongMode = true;
        if (speedLevel < 18) speedLevel++;
        currentDelay = max(320, baseDelay - speedLevel * 55);
        updateUI();
        if (roundTimer) clearTimeout(roundTimer);
        roundTimer = setTimeout(() => {
            if (gameActive) newRound();
        }, currentDelay);
    }

    function wrong(num) {
        playNote(num, false);
        failCount++;
        updateUI();
        correctFlash = 70;
        if (failCount >= 18) {
            gameActive = false;
            if (roundTimer) clearTimeout(roundTimer);
            resetAllBandsOff();
            failCounterDiv.html("18/18 · lost");
            // Reappear dotted wave
            dottedWaveAlpha = 255;
            dottedWaveFadeOut = false;
        } else {
            waitingForInput = true;
        }
    }

    function startGame() {
        gameActive = true;
        failCount = 0;
        correctCount = 0;
        speedLevel = 0;
        pingPongMode = false;
        dotOffset = 0;
        currentDelay = baseDelay;
        updateUI();
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (roundTimer) clearTimeout(roundTimer);
        activateAllBands();

        // Start fading out the dotted wave
        dottedWaveFadeOut = true;
        fadeStartTime = millis();
    }

    function handleNumber(num) {
        dismissStartupMessage();
        startAudio();
        if (!gameActive) {
            startGame();
            setTimeout(() => {
                if (gameActive && waitingForInput) {
                    if (num === currentTarget) correct(num);
                    else wrong(num);
                }
            }, 30);
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) correct(num);
        else wrong(num);
    }

    function draw() {
        // Update dotted wave fade
        if (dottedWaveFadeOut) {
            let elapsed = millis() - fadeStartTime;
            let newAlpha = 255 - elapsed * 2; // fade over ~1.3 sec
            if (newAlpha <= 0) {
                dottedWaveAlpha = 0;
                dottedWaveFadeOut = false;
            } else {
                dottedWaveAlpha = newAlpha;
            }
        }

        background(0);
        drawWaveforms();
        drawTargetDots();
        if (correctFlash > 0) {
            fill(255,255,255, correctFlash*0.25);
            rect(0,0,width,height);
            correctFlash -= 6;
        }
    }

    function keyPressed() {
        let k = key;
        if (k >= '1' && k <= '7') {
            handleNumber(parseInt(k,10));
            return false;
        }
        return false;
    }

    function touchStarted() {
        startAudio();
        return false;
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
        for (let band of bandNames) {
            let newPoints = [];
            for (let i=0; i<=width; i+=8) newPoints.push({x:i, y:height/2});
            wavePoints[band] = newPoints;
        }
    }
</script>
</body>
</html>
