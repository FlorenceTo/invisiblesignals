<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radio Signal Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Inter', 'Monument Grotesk Variable', monospace;
        }
        .control-panel {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            z-index: 30;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.25);
            pointer-events: auto;
        }
        .band-selector, .volume-control {
            background: rgba(20,20,30,0.7);
            border-radius: 32px;
            padding: 4px 14px;
            font-size: 12px;
            font-family: monospace;
            color: #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        select, input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: monospace;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        select option { background: #111; }
        .volume-control input {
            width: 100px;
        }
        .fail-counter {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-family: monospace;
            color: #ffaa88;
            border: 1px solid #ffaa88;
            pointer-events: none;
            z-index: 25;
        }
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            border: 1px solid #9afc97;
            transition: 0.2s;
        }
        .back-link:active {
            background: #9afc9722;
        }
        .instruction {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        @media (max-width: 700px) {
            .control-panel { top: 8px; gap: 10px; padding: 6px 12px; }
            .fail-counter { top: 70px; right: 12px; font-size: 10px; }
            .instruction { font-size: 9px; }
            .volume-control input { width: 70px; }
        }
    </style>
</head>
<body>
<div class="control-panel">
    <div class="band-selector">
        <span style="color:#aaa;">radio band</span>
        <select id="bandSelect">
            <option value="cband">C-band (4-8 GHz) – satellite TV, weather radar</option>
            <option value="kuband">Ku-band (12-18 GHz) – satellite broadcasting</option>
            <option value="lband">L-band (1-2 GHz) – GPS, mobile satellites</option>
            <option value="kaband">Ka-band (26-40 GHz) – high‑throughput satellites</option>
            <option value="xband">X-band (8-12 GHz) – military, space comms</option>
        </select>
    </div>
    <div class="volume-control">
        <span style="color:#aaa;">🔊 radio volume</span>
        <input type="range" id="radioVolume" min="0" max="1" step="0.01" value="0.28">
    </div>
</div>
<div class="fail-counter" id="failCounter">failures: 0 / 18</div>
<a href="index.html" class="back-link">← radio</a>
<div class="instruction">press 1 2 3 4 5 6 7 → match the number of dots</div>

<script>
    // ================================================================
    // RADIO SIGNAL GAME – white outline circles, working band-pass background
    // with volume control and 5 educational frequency bands.
    // Game mechanics: speed increases with correct answers, max 18 fails.
    // ================================================================

    let shapes = [];            // floating circles (white outline, fill 0)
    let keyMap = {};           
    let scaleFreqs = [261.63, 277.18, 329.63, 369.99, 415.30, 466.16, 493.88];
    let reverb, melodicFilter;

    // Background radio noise (band‑limited)
    let radioNoise;
    let radioBandFilter;
    let radioGain;
    let radioVolumeSlider;
    let bandSelectEl;
    let radioStarted = false;

    // Game state
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let feedbackTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;
    let baseDelay = 1500;
    let currentDelay = 1500;

    const validKeys = ['1','2','3','4','5','6','7'];
    const numToTone = {1:'A',2:'S',3:'D',4:'F',5:'G',6:'H',7:'J'};

    let failCounterDiv;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);
        
        // --- Melodic response audio (enigmatic scale with reverb) ---
        reverb = new p5.Reverb();
        reverb.set(4, 2);
        melodicFilter = new p5.LowPass();
        melodicFilter.freq(1200);
        
        let letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        for (let i = 0; i < letters.length; i++) {
            let octave = i < 7 ? 1 : i < 14 ? 2 : 3;
            keyMap[letters[i]] = scaleFreqs[i % scaleFreqs.length] / Math.pow(2, 1 - octave);
        }
        
        // --- Background radio synthesis (educational band‑pass filtered noise) ---
        radioNoise = new p5.Noise('brown');
        radioBandFilter = new p5.BandPass();
        radioBandFilter.res(6);      // moderate resonance, audible spectrum
        radioGain = new p5.Gain();
        radioNoise.disconnect();
        radioNoise.connect(radioBandFilter);
        radioBandFilter.connect(radioGain);
        radioGain.connect();
        
        // Default to C-band
        setBand("cband");
        radioNoise.amp(0.6);   // noise level before gain
        radioGain.amp(0.28);   // master volume
        
        // UI: band selection
        bandSelectEl = select('#bandSelect');
        bandSelectEl.changed(() => {
            setBand(bandSelectEl.value());
        });
        
        // Volume control
        radioVolumeSlider = select('#radioVolume');
        radioVolumeSlider.input(() => {
            let vol = parseFloat(radioVolumeSlider.value());
            if (radioGain) radioGain.amp(vol);
        });
        
        // No autoplay – we start radio on first user interaction
        // but the element exists; we'll start in keyPressed/touchStarted
        
        failCounterDiv = select('#failCounter');
        updateFailDisplay();
        
        // initial display
        background(0);
    }
    
    // Start background radio (called once on first user input)
    function startRadioBackground() {
        if (radioStarted) return;
        radioStarted = true;
        radioNoise.start();
        radioGain.amp(parseFloat(radioVolumeSlider.value()));
    }
    
    // Set center frequency based on selected band (educational values in Hz)
    function setBand(band) {
        let freqHz;
        switch(band) {
            case "cband":   freqHz = 6000; break;    // 6 GHz
            case "kuband":  freqHz = 15000; break;   // 15 GHz
            case "lband":   freqHz = 1500; break;    // 1.5 GHz
            case "kaband":  freqHz = 33000; break;   // 33 GHz (27-40)
            case "xband":   freqHz = 10000; break;   // 10 GHz
            default: freqHz = 6000;
        }
        if (radioBandFilter) radioBandFilter.freq(freqHz);
        // optional: visual feedback
        let ctrl = select('.control-panel');
        if (ctrl) ctrl.style('border-color', '#9afc97');
    }
    
    function draw() {
        background(0);
        
        // draw floating circles (white outline, fully transparent fill, resonance trails)
        for (let i = shapes.length - 1; i >= 0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;
            
            let level = s.amp.getLevel();
            let ampScale = map(level, 0, 0.3, 0.6, 1.7);
            
            // resonance trail: faint white traces
            s.trail.push({x: s.x, y: s.y, opacity: 120});
            if (s.trail.length > 22) s.trail.shift();
            for (let t of s.trail) {
                fill(255, t.opacity * 0.4);
                noStroke();
                circle(t.x, t.y, 14 * ampScale);
                t.opacity -= 3.5;
            }
            
            // subtle glow (barely visible)
            if (s.glow > 0) {
                fill(255, 80, 80, s.glow * 0.2);
                noStroke();
                circle(s.x, s.y, 28 * ampScale);
                s.glow *= 0.94;
            }
            
            // main circle: white outline, empty fill
            stroke(255);
            strokeWeight(1.3);
            fill(0, 0);               // completely transparent fill
            circle(s.x, s.y, 24 * ampScale);
            noStroke();
            
            s.opacity -= 1.2;
            if (s.opacity <= 0) {
                if (s.osc) s.osc.amp(0, 1.0);
                setTimeout(() => { if(s.osc) s.osc.stop(); }, 1100);
                shapes.splice(i, 1);
            }
        }
        
        // Draw target dots (white, pure, clean)
        drawTargetDots();
        
        // Flash feedback (white/grey)
        if (correctFlash > 0) {
            fill(255, 255, 255, correctFlash * 0.35);
            rect(0, 0, width, height);
            correctFlash -= 7;
        }
        
        // Game over screen
        if (!gameActive) {
            fill(220, 220, 220, 220);
            textAlign(CENTER, CENTER);
            textSize(24);
            textFont('monospace');
            text("signal lost", width/2, height/2 - 40);
            textSize(13);
            text("press 1-7 to restart", width/2, height/2 + 20);
        }
    }
    
    function drawTargetDots() {
        if (!gameActive) return;
        let dotDiameter = 50;
        let spacing = 74;
        let total = currentTarget;
        let startX = width/2 - (total-1) * spacing / 2;
        let yPos = height/2;
        
        for (let i = 0; i < total; i++) {
            fill(255, 230);
            noStroke();
            circle(startX + i * spacing, yPos, dotDiameter);
            // subtle inner highlight
            fill(255, 80);
            circle(startX + i * spacing, yPos, dotDiameter * 0.3);
        }
        
        // speed indicator
        fill(150, 150, 150, 160);
        textSize(11);
        textAlign(CENTER, BOTTOM);
        text("speed: " + (speedLevel + 1), width/2, height/2 - 55);
    }
    
    // play melodic response tone (enigmatic)
    function playToneForNumber(num) {
        let letter = numToTone[num];
        if (!letter) return;
        let freq = keyMap[letter];
        if (!freq) return;
        
        let osc = new p5.Oscillator('triangle');
        osc.freq(freq);
        osc.start();
        osc.amp(0.3, 0.03);
        osc.freq(freq * (1 + random(-0.002, 0.002)));
        osc.disconnect();
        osc.connect(melodicFilter);
        reverb.process(melodicFilter, 2.2, 1.9);
        
        let ampObj = new p5.Amplitude();
        ampObj.setInput(osc);
        
        // create a white-outline circle
        shapes.push({
            x: random(width),
            y: random(height),
            vx: random(-1.8, 1.8),
            vy: random(-2.2, -0.5),
            osc: osc,
            amp: ampObj,
            opacity: 220,
            trail: [],
            glow: 130
        });
    }
    
    function updateSpeed() {
        currentDelay = max(320, baseDelay - (speedLevel * 55));
    }
    
    function nextRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
    }
    
    function onCorrect() {
        playToneForNumber(currentTarget);
        correctFlash = 110;
        waitingForInput = false;
        if (speedLevel < 18) speedLevel++;
        updateSpeed();
        if (feedbackTimer) clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
            if (gameActive) nextRound();
            feedbackTimer = null;
        }, currentDelay);
    }
    
    function onWrong() {
        failCount++;
        updateFailDisplay();
        correctFlash = 70;
        if (failCount >= 18) {
            gameOver();
            return;
        }
        waitingForInput = true;   // stay on same target
    }
    
    function gameOver() {
        gameActive = false;
        waitingForInput = false;
        if (feedbackTimer) clearTimeout(feedbackTimer);
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.4);
        }
        shapes = [];
        failCounterDiv.html("failures: " + failCount + " / 18  ·  signal lost");
    }
    
    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.3);
        }
        shapes = [];
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (feedbackTimer) clearTimeout(feedbackTimer);
    }
    
    function updateFailDisplay() {
        failCounterDiv.html("failures: " + failCount + " / 18");
        if (failCount >= 15) failCounterDiv.style('color', '#ff8888');
        else failCounterDiv.style('color', '#ffaa88');
    }
    
    // ---- User interaction: start audio + game ----
    function handleKey(numStr) {
        let num = parseInt(numStr, 10);
        if (isNaN(num) || num < 1 || num > 7) return;
        
        // ensure radio background starts
        if (!radioStarted) startRadioBackground();
        
        if (!gameActive) {
            userStartAudio();
            startGame();
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) onCorrect();
        else onWrong();
    }
    
    function keyPressed() {
        let k = key;
        if (validKeys.includes(k)) {
            userStartAudio();
            handleKey(k);
            return false;
        }
        if (!gameActive && validKeys.includes(k)) {
            userStartAudio();
            startRadioBackground();
            startGame();
            return false;
        }
        return false;
    }
    
    function touchStarted() {
        userStartAudio();
        if (!radioStarted) startRadioBackground();
        return false;
    }
    
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
    }
</script>
</body>
</html>
