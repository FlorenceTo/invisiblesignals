<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sound Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Inter', 'Monument Grotesk Variable', monospace;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            width: fit-content;
            margin: 0 auto;
            border-radius: 40px;
            font-size: 14px;
            font-family: monospace;
            color: #9afc97;
            pointer-events: none;
            z-index: 20;
            border: 1px solid #9afc97;
        }
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            border: 1px solid #9afc97;
            transition: 0.2s;
        }
        .back-link:active {
            background: #9afc9722;
        }
        .status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-family: monospace;
            color: #9afc97;
            pointer-events: none;
            z-index: 20;
        }
        @media (max-width: 640px) {
            .info { font-size: 12px; bottom: 16px; }
            .back-link { bottom: 16px; left: 12px; font-size: 10px; }
            .status { font-size: 10px; top: 12px; left: 12px; }
        }
    </style>
</head>
<body>
<div class="status" id="gameStatus">press any key to start</div>
<div class="info">dots = number &nbsp;&nbsp;|&nbsp;&nbsp; keys: A(1) S(2) D(3) F(4) G(5) H(6) J(7)</div>
<a href="index.html" class="back-link">← radio</a>

<script>
    // --------------------------------------------------------------
    // DOT-COUNT GAME – based on original ellipse visual style
    // No score, no polygons – pure ellipses, trails, reverb.
    // Show random number of dots (1-7). User must press matching key.
    // --------------------------------------------------------------

    let shapes = [];           // visual ellipses from key presses (same as original)
    let keyMap = {};
    let scaleFreqs = [261.63, 277.18, 329.63, 369.99, 415.30, 466.16, 493.88]; // enigmatic scale
    let reverb;
    let filter;               // low-pass filter for dreaminess

    // Game state
    let gameActive = false;
    let currentTarget = 1;    // number of dots (1 to 7)
    let waitingForInput = true;
    let feedbackTimer = null;
    let correctFlash = 0;     // for visual feedback

    // Mapping: key -> target number (A=1, S=2, D=3, F=4, G=5, H=6, J=7)
    const keyToNumber = {
        'A': 1, 'S': 2, 'D': 3, 'F': 4,
        'G': 5, 'H': 6, 'J': 7
    };
    const validKeys = ['A','S','D','F','G','H','J'];

    // UI elements
    let statusDiv;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);

        // Audio setup (same as original sketch)
        reverb = new p5.Reverb();
        reverb.set(4, 2);
        filter = new p5.LowPass();
        filter.freq(1200);

        // Map full alphabet to frequencies (enigmatic scale, octaves)
        let keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        for (let i = 0; i < keys.length; i++) {
            let octave = i < 7 ? 1 : i < 14 ? 2 : 3;
            keyMap[keys[i]] = scaleFreqs[i % scaleFreqs.length] / Math.pow(2, 1 - octave);
        }

        statusDiv = select('#gameStatus');
    }

    function draw() {
        background(0);

        // Draw floating ellipses (same as original sketch)
        for (let i = shapes.length - 1; i >= 0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;

            let level = s.amp.getLevel();
            let ampScale = map(level, 0, 0.3, 0.5, 2);

            // Draw trail
            s.trail.push({x: s.x, y: s.y, opacity: 255});
            if (s.trail.length > 30) s.trail.shift();
            for (let t of s.trail) {
                fill(255, t.opacity);
                ellipse(t.x, t.y, 20 * ampScale);
                t.opacity -= 6;
            }

            // Glow
            if (s.glow > 0) {
                fill(255, 50, 50, s.glow);
                ellipse(s.x, s.y, 36 * ampScale);
                s.glow *= 0.92;
            }

            // Main ellipse outline
            stroke(255);
            strokeWeight(1.5);
            fill(255, s.opacity);
            ellipse(s.x, s.y, 30 * ampScale);
            noStroke();

            s.opacity -= 1;
            if (s.opacity <= 0) {
                s.osc.amp(0, 1.5);
                setTimeout(() => s.osc.stop(), 1600);
                shapes.splice(i, 1);
            }
        }

        // Draw the target dots (static in the center)
        drawTargetDots();

        // Draw correct flash overlay
        if (correctFlash > 0) {
            fill(154, 252, 151, correctFlash * 0.8);
            rect(0, 0, width, height);
            correctFlash -= 8;
        }
    }

    // Draw the required number of dots (no text, just circles)
    function drawTargetDots() {
        if (!gameActive) {
            // Draw a subtle invitation
            fill(100, 100, 100, 100);
            textAlign(CENTER, CENTER);
            textSize(20);
            textFont('monospace');
            text("press any key to start", width/2, height/2 - 40);
            return;
        }

        let dotDiameter = 45;
        let spacing = 70;
        let totalDots = currentTarget;
        let startX = width/2 - (totalDots-1) * spacing / 2;
        let yPos = height/2;

        for (let i = 0; i < totalDots; i++) {
            fill(154, 252, 151, 220);
            noStroke();
            ellipse(startX + i * spacing, yPos, dotDiameter, dotDiameter);
            // inner highlight
            fill(255, 255, 255, 180);
            ellipse(startX + i * spacing, yPos, dotDiameter * 0.45, dotDiameter * 0.45);
        }

        // subtle instruction text
        fill(154, 252, 151, 150);
        textSize(14);
        textAlign(CENTER, TOP);
        text("press matching key", width/2, height/2 + 50);
    }

    // Play a tone (using the same sound engine as original)
    function playToneForNumber(num) {
        let keyChar = null;
        for (let [k, v] of Object.entries(keyToNumber)) {
            if (v === num) { keyChar = k; break; }
        }
        if (!keyChar) return;
        let freq = keyMap[keyChar];
        if (!freq) return;

        let osc = new p5.Oscillator('triangle');
        osc.freq(freq);
        osc.start();
        osc.amp(0.3, 0.05);
        osc.freq(freq * (1 + random(-0.002, 0.002)));

        osc.disconnect();
        osc.connect(filter);
        reverb.process(filter, 2, 2);

        let amp = new p5.Amplitude();
        amp.setInput(osc);

        // Create a visual shape (exactly like original)
        let s = {
            x: random(width),
            y: random(height),
            vx: random(-2, 2),
            vy: random(-2, 2),
            osc: osc,
            amp: amp,
            opacity: 255,
            trail: [],
            glow: 250
        };
        shapes.push(s);
    }

    // Generate new random target (1-7)
    function newRandomTarget() {
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (statusDiv) statusDiv.html("your turn");
    }

    // Handle correct answer
    function onCorrect() {
        playToneForNumber(currentTarget);
        correctFlash = 180;   // green flash
        if (statusDiv) statusDiv.html("correct!");
        waitingForInput = false;

        // Clear any pending timer
        if (feedbackTimer) clearTimeout(feedbackTimer);
        // After a short pause, show next target
        feedbackTimer = setTimeout(() => {
            newRandomTarget();
            feedbackTimer = null;
        }, 500);
    }

    // Handle wrong answer: show error, keep same target
    function onWrong() {
        correctFlash = 80;    // redder flash (but we use greenish? make red)
        fill(255, 80, 80, 120);
        rect(0, 0, width, height);
        if (statusDiv) statusDiv.html("wrong – try again");
        // Play a short error buzz? Optional: play a low unpleasant note? Better not.
        // Just visual feedback. Keep same target.
        waitingForInput = true;
        // reset status after 0.8s
        setTimeout(() => {
            if (gameActive && waitingForInput) statusDiv.html("your turn");
        }, 800);
    }

    // Start the game (called once on first key)
    function startGame() {
        if (gameActive) return;
        gameActive = true;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (statusDiv) statusDiv.html("your turn");
        // Clear any existing shapes from previous idle state
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.5);
        }
        shapes = [];
    }

    // Handle key press (game logic)
    function handleKey(keyChar) {
        if (!gameActive) {
            // Start game on any key
            userStartAudio();
            startGame();
            return;
        }

        if (!waitingForInput) return; // between rounds, ignore

        let pressedNum = keyToNumber[keyChar];
        if (pressedNum === undefined) return; // invalid key

        if (pressedNum === currentTarget) {
            onCorrect();
        } else {
            onWrong();
        }
    }

    // p5 keyPressed callback
    function keyPressed() {
        let k = key.toUpperCase();
        if (validKeys.includes(k)) {
            userStartAudio();   // ensure audio context
            handleKey(k);
            return false;
        }
        // any key to start if game not active
        if (!gameActive) {
            userStartAudio();
            startGame();
        }
        return false;
    }

    // Touch/mouse support for mobile starts game
    function touchStarted() {
        userStartAudio();
        if (!gameActive) startGame();
        return false;
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
    }
</script>
</body>
</html>
