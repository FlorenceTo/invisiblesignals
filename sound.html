<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Radio Signal Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: pan-x pan-y;
        }
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 60px;
            pointer-events: auto;
            font-family: monospace;
        }
        .band-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .band-btn {
            background: rgba(30,30,40,0.8);
            border: 1px solid #ff4444;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff8888;
            cursor: pointer;
            transition: 0.1s;
        }
        .band-btn.active {
            background: #9afc9722;
            border-color: #9afc97;
            color: #9afc97;
        }
        .fail-counter {
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff0000;
            border: 1px solid #ff0000;
            white-space: nowrap;
        }
        .back-link {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: transparent;
            padding: 6px 0;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            transition: opacity 0.2s;
        }
        .instruction {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        .startup-message {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 40px;
            color: #ffffff;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #ffffff;
            max-width: 85%;
            transition: opacity 1s ease;
            white-space: nowrap;
        }
        @media (max-width: 640px) {
            .band-btn, .all-on-btn { font-size: 9px; padding: 4px 8px; }
            .fail-counter { font-size: 9px; padding: 4px 8px; }
            .startup-message { font-size: 11px; white-space: normal; width: 90%; padding: 12px 16px; top: 20%; }
        }
        @media (max-width: 480px) {
            .startup-message { font-size: 10px; top: 18%; }
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="band-buttons" id="bandButtons">
        <button class="band-btn active" data-band="cband">C‑band (600 Hz)</button>
        <button class="band-btn" data-band="kuband">Ku‑band (1800 Hz)</button>
        <button class="band-btn" data-band="lband">L‑band (350 Hz)</button>
        <button class="band-btn" data-band="kaband">Ka‑band (5000 Hz)</button>
        <button class="band-btn" data-band="xband">X‑band (1000 Hz)</button>
    </div>
    <div class="fail-counter" id="failCounter">failures 0/18</div>
</div>
<a href="index.html" class="back-link">← radio</a>
<div class="instruction">press keys 1 2 3 4 5 6 7 → match dots</div>
<div id="startupMsg" class="startup-message">Use Firefox browser for best experience<br>press 1 to start</div>

<script>
    // ================================================================
    // FINAL WORKING VERSION – each band toggles its own filtered noise.
    // Number tones raised by 5 semitones, full volume.
    // ================================================================

    let shapes = [];
    let ripples = [];
    let reverb, melodicFilter;

    // Number‑press frequencies (raised 5 semitones from original)
    // Original base: 110, 123.75, 132, 137.5, 146.67, 154.66, 165
    // Multiply by 2^(5/12) ≈ 1.33483985417
    const feedbackFreqs = [
        110.00 * 1.33483985417,
        123.75 * 1.33483985417,
        132.00 * 1.33483985417,
        137.50 * 1.33483985417,
        146.67 * 1.33483985417,
        154.66 * 1.33483985417,
        165.00 * 1.33483985417
    ];

    // Radio background – independent per‑band gain
    let radioNoise;
    let bandFilters = {};
    let bandGains = {};
    let bandActive = {
        cband: true,
        kuband: false,
        lband: false,
        kaband: false,
        xband: false
    };
    let radioMasterGain;
    let radioStarted = false;

    // Band frequencies (Hz)
    const bandFreqs = {
        cband: 600,
        kuband: 1800,
        lband: 350,
        kaband: 5000,
        xband: 1000
    };

    // Waveform storage
    let wavePoints = {};

    // Game state
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let feedbackTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;
    let baseDelay = 1500;
    let currentDelay = 1500;

    let failCounterDiv, startupMsgDiv;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);

        // Reverb and filter for number tones
        reverb = new p5.Reverb();
        reverb.set(5, 3);
        melodicFilter = new p5.LowPass();
        melodicFilter.freq(2200);

        // ----- Radio background: one noise source, split into bands -----
        radioNoise = new p5.Noise('brown');
        radioNoise.amp(0.3);          // quiet source

        radioMasterGain = new p5.Gain();
        radioMasterGain.amp(0.25);    // fixed overall low volume

        for (let band of ['cband', 'kuband', 'lband', 'kaband', 'xband']) {
            let bp = new p5.BandPass();
            bp.freq(bandFreqs[band]);
            bp.res(6);
            let gain = new p5.Gain();
            radioNoise.connect(bp);
            bp.connect(gain);
            gain.connect(radioMasterGain);
            gain.amp(bandActive[band] ? 1.0 : 0.0);
            bandFilters[band] = bp;
            bandGains[band] = gain;

            // Prepare waveform points for each band
            wavePoints[band] = [];
            for (let i = 0; i <= width; i += 8) {
                wavePoints[band].push({x: i, y: height/2});
            }
        }
        radioMasterGain.connect();

        // Band button event listeners
        let btns = selectAll('.band-btn');
        for (let btn of btns) {
            btn.mousePressed(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
            });
            btn.touchStarted(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
                return false;
            });
        }

        failCounterDiv = select('#failCounter');
        startupMsgDiv = select('#startupMsg');

        background(0);
    }

    function toggleBand(band) {
        bandActive[band] = !bandActive[band];
        bandGains[band].amp(bandActive[band] ? 1.0 : 0.0);
        let btn = select(`.band-btn[data-band="${band}"]`);
        if (bandActive[band]) {
            btn.addClass('active');
            btn.removeClass('muted');
        } else {
            btn.removeClass('active');
            btn.addClass('muted');
        }
    }

    function startRadioBackground() {
        if (radioStarted) return;
        radioStarted = true;
        radioNoise.start();
    }

    function dismissStartupMessage() {
        if (startupMsgDiv && startupMsgDiv.elt) {
            startupMsgDiv.style('opacity', '0');
            setTimeout(() => {
                if (startupMsgDiv && startupMsgDiv.elt) startupMsgDiv.remove();
            }, 1000);
        }
    }

    // ----- Draw stacked waveforms for active bands -----
    function drawWaveforms() {
        let t = frameCount;
        for (let band of Object.keys(bandActive)) {
            if (!bandActive[band]) continue;
            let freq = bandFreqs[band];
            let amplitude = 40 + 10 * sin(t * 0.015);
            let phase = t * (freq / 1800.0);
            let points = wavePoints[band];
            for (let i = 0; i < points.length; i++) {
                let x = points[i].x;
                let y = height/2 + sin(x * freq / 7000.0 + phase) * amplitude + cos(x * freq / 11000.0) * (amplitude * 0.5);
                points[i].y = y;
            }
            stroke(154, 252, 151, 100);
            strokeWeight(1.0);
            noFill();
            beginShape();
            for (let p of points) vertex(p.x, p.y);
            endShape();
        }

        // White particles
        stroke(255, 180);
        strokeWeight(1);
        for (let i = 0; i < 40; i++) {
            let x = (t * 0.8 + i * 70) % width;
            let y = height/2 + sin(x * 0.01 + t * 0.05) * 30;
            point(x, y);
        }

        // Active bands counter
        let activeCount = Object.values(bandActive).filter(v => v).length;
        fill(200, 200, 200, 150);
        noStroke();
        textAlign(LEFT, TOP);
        textSize(10);
        textFont('monospace');
        text(`active bands: ${activeCount}`, 15, 65);
    }

    // ----- Number tone (full volume, reduced chorus) -----
    function playNumberTone(num) {
        let baseFreq = feedbackFreqs[num-1];
        if (!baseFreq) return;
        addRipple(baseFreq);

        let env = new p5.Envelope();
        env.setADSR(0.02, 0.15, 0.6, 1.2);
        env.setRange(0.28 * 1.35, 0);   // full volume

        let voices = [];
        let detunes = [0, 5, -5];       // reduced chorus
        for (let cents of detunes) {
            let osc = new p5.Oscillator('sine');
            let freq = baseFreq * Math.pow(2, cents / 1200);
            osc.freq(freq);
            osc.start();
            env.play(osc);
            osc.disconnect();
            osc.connect(melodicFilter);
            voices.push(osc);
        }
        melodicFilter.disconnect();
        melodicFilter.connect(reverb);
        reverb.process(melodicFilter, 3.5, 2.5);

        let ampObj = new p5.Amplitude();
        ampObj.setInput(voices[0]);
        shapes.push({
            x: random(width), y: random(height),
            vx: random(-1.8, 1.8), vy: random(-2.2, -0.5),
            osc: voices[0], amp: ampObj, opacity: 200,
            extraOscs: voices.slice(1)
        });
        setTimeout(() => {
            for (let v of voices) v.stop();
            let idx = shapes.findIndex(s => s.osc === voices[0]);
            if (idx !== -1) shapes.splice(idx, 1);
        }, 1800);
    }

    function addRipple(freq) {
        ripples.push({
            x: width/2, y: height/2, radius: 20,
            maxRadius: min(width,height)*0.7, life: 255, freq: freq
        });
    }

    function drawRipples() {
        for (let i = ripples.length-1; i >= 0; i--) {
            let r = ripples[i];
            r.radius += 5;
            r.life -= 6;
            if (r.radius > r.maxRadius || r.life <= 0) {
                ripples.splice(i,1);
                continue;
            }
            noFill();
            stroke(154,252,151, r.life);
            strokeWeight(1.2);
            circle(r.x, r.y, r.radius*2);
            let inner = r.radius * (r.freq/350);
            stroke(255,200,100, r.life*0.6);
            circle(r.x, r.y, inner*2);
        }
    }

    // ----- Game logic -----
    function updateSpeed() { currentDelay = max(320, baseDelay - (speedLevel * 55)); }
    function nextRound() { if (gameActive) { currentTarget = floor(random(1,8)); waitingForInput = true; } }
    function onCorrect() {
        playNumberTone(currentTarget);
        correctFlash = 110;
        waitingForInput = false;
        if (speedLevel < 18) speedLevel++;
        updateSpeed();
        if (feedbackTimer) clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => { if (gameActive) nextRound(); feedbackTimer = null; }, currentDelay);
    }
    function onWrong() {
        failCount++;
        updateFailDisplay();
        correctFlash = 70;
        if (failCount >= 18) gameOver();
        else waitingForInput = true;
    }
    function gameOver() {
        gameActive = false;
        waitingForInput = false;
        if (feedbackTimer) clearTimeout(feedbackTimer);
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0,0.3);
            if (s.extraOscs) for (let o of s.extraOscs) o.amp(0,0.3);
        }
        shapes = [];
        ripples = [];
        failCounterDiv.html("failures 18/18 · lost");
    }
    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0,0.3);
        }
        shapes = [];
        ripples = [];
        currentTarget = floor(random(1,8));
        waitingForInput = true;
        if (feedbackTimer) clearTimeout(feedbackTimer);
    }
    function updateFailDisplay() { failCounterDiv.html("failures " + failCount + "/18"); }

    function draw() {
        background(0);
        drawWaveforms();
        drawRipples();

        // Floating circles from number presses
        for (let i=shapes.length-1; i>=0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;
            let level = s.amp.getLevel();
            let ampScale = map(level, 0, 0.3, 0.6, 1.6);
            stroke(255);
            strokeWeight(1.3);
            fill(0,0);
            circle(s.x, s.y, 24 * ampScale);
            noStroke();
            s.opacity -= 1.5;
            if (s.opacity <= 0) {
                if (s.osc) s.osc.amp(0,0.8);
                shapes.splice(i,1);
            }
        }

        drawTargetDots();

        if (correctFlash > 0) {
            fill(255,255,255, correctFlash*0.25);
            rect(0,0,width,height);
            correctFlash -= 6;
        }

        if (!gameActive) {
            fill(255,255,255);
            textAlign(CENTER,CENTER);
            textSize(20);
            textFont('monospace');
            text("signal lost", width/2, height/2);
        }
    }

    function drawTargetDots() {
        if (!gameActive) return;
        let dia = 28, spc = 50, total = currentTarget;
        let startX = width/2 - (total-1)*spc/2;
        for (let i=0; i<total; i++) {
            fill(255,220);
            noStroke();
            circle(startX + i*spc, height/2, dia);
            fill(255,80);
            circle(startX + i*spc, height/2, dia*0.3);
        }
        fill(160,160,160,200);
        textSize(10);
        textAlign(CENTER,BOTTOM);
        textFont('monospace');
        text("speed: " + (speedLevel+1), width/2, height/2-48);
    }

    function handleNumberPress(num) {
        dismissStartupMessage();
        userStartAudio().then(() => { if (!radioStarted) startRadioBackground(); })
                       .catch(() => { if (!radioStarted) startRadioBackground(); });
        if (!radioStarted) startRadioBackground();

        if (!gameActive) {
            startGame();
            setTimeout(() => {
                if (gameActive && waitingForInput) {
                    if (num === currentTarget) onCorrect();
                    else onWrong();
                }
            }, 50);
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) onCorrect();
        else onWrong();
    }

    function keyPressed() {
        let k = key;
        if (['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        if (!gameActive && ['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        return false;
    }

    function touchStarted() {
        userStartAudio().catch(()=>{});
        return false;
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
        for (let band of Object.keys(wavePoints)) {
            let newPoints = [];
            for (let i=0; i<=width; i+=8) newPoints.push({x:i, y:height/2});
            wavePoints[band] = newPoints;
        }
    }
</script>
</body>
</html>
