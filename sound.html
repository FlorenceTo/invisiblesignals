<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Signal Interference | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: pan-x pan-y;
        }
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 60px;
            pointer-events: auto;
            font-family: monospace;
        }
        .carrier-toggle {
            background: rgba(30,30,40,0.8);
            border: 1px solid #ff4444;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff8888;
            cursor: pointer;
            transition: 0.1s;
        }
        .carrier-toggle.active {
            background: #9afc9722;
            border-color: #9afc97;
            color: #9afc97;
        }
        .fail-counter {
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff0000;
            border: 1px solid #ff0000;
            white-space: nowrap;
        }
        .back-link {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: transparent;
            padding: 6px 0;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            transition: opacity 0.2s;
        }
        .instruction {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        .startup-message {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 40px;
            color: #ffffff;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #ffffff;
            max-width: 85%;
            transition: opacity 1s ease;
            white-space: nowrap;
        }
        @media (max-width: 640px) {
            .carrier-toggle { font-size: 9px; padding: 4px 8px; }
            .fail-counter { font-size: 9px; padding: 4px 8px; }
            .startup-message { font-size: 11px; white-space: normal; width: 90%; padding: 12px 16px; top: 20%; }
        }
        @media (max-width: 480px) {
            .startup-message { font-size: 10px; top: 18%; }
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <button id="carrierBtn" class="carrier-toggle active">carrier wave on</button>
    <div class="fail-counter" id="failCounter">failures 0/18</div>
</div>
<a href="index.html" class="back-link">← radio</a>
<div class="instruction">press 1‑7 to match dots</div>
<div id="startupMsg" class="startup-message">for best performance use Firefox<br>press 1 to start</div>

<script>
    // ================================================================
    // SIMPLE, RELIABLE GAME
    // - Continuous carrier wave (sine, 440 Hz) with toggle on/off
    // - On correct match: short interference burst (noise + amplitude dip)
    // - Visual wave that pulses on correct answer
    // - No emojis, monospace, green/red
    // ================================================================

    let carrierOsc;
    let carrierEnv;
    let carrierOn = true;
    let carrierGain;
    let audioStarted = false;

    // Game variables
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let roundTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;
    let baseDelay = 1500;
    let currentDelay = 1500;

    // Visual wave points
    let wavePoints = [];
    let waveAmp = 40;
    let wavePulse = 0;   // extra amplitude on correct answer

    let failCounterDiv, startupMsgDiv, carrierBtn;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);

        // Carrier wave: sine at 440 Hz, quiet volume (0.15)
        carrierOsc = new p5.Oscillator('sine');
        carrierOsc.freq(440);
        carrierEnv = new p5.Envelope();
        carrierEnv.setADSR(0.01, 0.1, 1.0, 0.05);
        carrierEnv.setRange(0.15, 0);
        carrierGain = new p5.Gain();
        carrierOsc.connect(carrierGain);
        carrierGain.connect();
        carrierGain.amp(0); // start silent, will be set when carrier toggled on

        // Visual wave points
        for (let i = 0; i <= width; i += 8) {
            wavePoints.push({x: i, y: height/2});
        }

        // UI elements
        failCounterDiv = select('#failCounter');
        startupMsgDiv = select('#startupMsg');
        carrierBtn = select('#carrierBtn');
        carrierBtn.mousePressed(toggleCarrier);
        carrierBtn.touchStarted(toggleCarrier);

        updateFailDisplay();
        background(0);
    }

    function toggleCarrier() {
        if (!audioStarted) {
            // First tap: start audio context and oscillator
            userStartAudio().then(() => {
                audioStarted = true;
                carrierOsc.start();
                if (carrierOn) carrierGain.amp(0.15);
                else carrierGain.amp(0);
            }).catch(e => console.log(e));
        } else {
            if (carrierOn) {
                carrierGain.amp(0);
                carrierOn = false;
                carrierBtn.html('carrier wave off');
                carrierBtn.removeClass('active');
            } else {
                carrierGain.amp(0.15);
                carrierOn = true;
                carrierBtn.html('carrier wave on');
                carrierBtn.addClass('active');
            }
        }
    }

    function startAudio() {
        if (audioStarted) return;
        userStartAudio().then(() => {
            audioStarted = true;
            carrierOsc.start();
            if (carrierOn) carrierGain.amp(0.15);
        }).catch(e => console.log(e));
    }

    function dismissStartupMessage() {
        if (startupMsgDiv && startupMsgDiv.elt) {
            startupMsgDiv.style('opacity', '0');
            setTimeout(() => startupMsgDiv.remove(), 1000);
        }
    }

    // Short interference burst (filtered noise)
    function playInterference(pulses) {
        // Create a burst of filtered noise (bandpass)
        let noise = new p5.Noise('brown');
        let bp = new p5.BandPass();
        bp.freq(800);
        bp.res(8);
        noise.connect(bp);
        bp.connect();
        let env = new p5.Envelope();
        env.setADSR(0.01, 0.05, 0.2, 0.1);
        env.setRange(0.25, 0);
        noise.amp(0);
        noise.start();
        env.play(noise);
        // pulse repeatedly if pulses > 1? Actually we want one burst but with number of pulses = number of dots?
        // For simplicity: one interference burst, but the number of pulses can be emulated by repeating the burst.
        // But to keep clean: we just play a single burst and flash the wave multiple times.
        setTimeout(() => {
            noise.stop();
            bp.disconnect();
        }, 200);
        // Visual wave pulse
        wavePulse = 25;
        // Also add a visual ripple
        for (let i = 0; i < pulses; i++) {
            setTimeout(() => {
                // additional small ripples
            }, i * 60);
        }
    }

    // Update waveform (dynamic)
    function drawWaveform() {
        let t = frameCount;
        let freq = 0.8; // base frequency of wave
        let amplitude = 40 + wavePulse + 8 * sin(t * 0.02);
        if (wavePulse > 0) wavePulse *= 0.92;
        for (let i = 0; i < wavePoints.length; i++) {
            let x = wavePoints[i].x;
            let y = height/2 + sin(x * 0.012 + t * 0.03) * amplitude + cos(x * 0.008 + t * 0.02) * (amplitude * 0.5);
            wavePoints[i].y = y;
        }
        stroke(154, 252, 151, 180);
        strokeWeight(1.5);
        noFill();
        beginShape();
        for (let p of wavePoints) vertex(p.x, p.y);
        endShape();
        // top status
        fill(200,200,200,150);
        textAlign(LEFT, TOP);
        textSize(10);
        textFont('monospace');
        text(`carrier: ${carrierOn ? 'on' : 'off'}`, 15, 65);
    }

    // Game logic
    function newRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
    }

    function correct() {
        playInterference(currentTarget);
        correctFlash = 110;
        waitingForInput = false;
        if (speedLevel < 18) speedLevel++;
        currentDelay = max(320, baseDelay - speedLevel * 55);
        if (roundTimer) clearTimeout(roundTimer);
        roundTimer = setTimeout(() => {
            if (gameActive) newRound();
        }, currentDelay);
    }

    function wrong() {
        failCount++;
        updateFailDisplay();
        correctFlash = 70;
        if (failCount >= 18) {
            gameActive = false;
            if (roundTimer) clearTimeout(roundTimer);
            failCounterDiv.html("failures 18/18 · lost");
        } else {
            waitingForInput = true;
        }
    }

    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (roundTimer) clearTimeout(roundTimer);
    }

    function updateFailDisplay() {
        failCounterDiv.html("failures " + failCount + "/18");
    }

    function handleNumber(num) {
        dismissStartupMessage();
        startAudio();
        if (!gameActive) {
            startGame();
            setTimeout(() => {
                if (gameActive && waitingForInput) {
                    if (num === currentTarget) correct();
                    else wrong();
                }
            }, 30);
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) correct();
        else wrong();
    }

    function drawTargetDots() {
        if (!gameActive) return;
        let dia = 28, spc = 50, total = currentTarget;
        let startX = width/2 - (total-1)*spc/2;
        for (let i=0; i<total; i++) {
            fill(255,220);
            noStroke();
            circle(startX + i*spc, height/2, dia);
            fill(255,80);
            circle(startX + i*spc, height/2, dia*0.3);
        }
        fill(160,160,160,200);
        textSize(10);
        textAlign(CENTER,BOTTOM);
        textFont('monospace');
        text("speed: " + (speedLevel+1), width/2, height/2-48);
    }

    function draw() {
        background(0);
        drawWaveform();
        drawTargetDots();
        if (correctFlash > 0) {
            fill(255,255,255, correctFlash*0.25);
            rect(0,0,width,height);
            correctFlash -= 6;
        }
        if (!gameActive && audioStarted) {
            fill(255,255,255);
            textAlign(CENTER,CENTER);
            textSize(20);
            textFont('monospace');
            text("signal lost", width/2, height/2);
        }
        // Show startup message if game not started and audio not started (only if message still exists)
    }

    function keyPressed() {
        let k = key;
        if (k >= '1' && k <= '7') {
            handleNumber(parseInt(k,10));
            return false;
        }
        return false;
    }

    function touchStarted() {
        startAudio();
        return false;
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
        wavePoints = [];
        for (let i = 0; i <= width; i += 8) wavePoints.push({x: i, y: height/2});
    }
</script>
</body>
</html>
