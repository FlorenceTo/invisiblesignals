<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Radio Signal Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Inter', 'Monument Grotesk Variable', monospace;
            touch-action: pan-x pan-y;
        }
        /* control panel – no green border */
        .control-panel {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 40px;
            pointer-events: auto;
        }
        .band-selector, .volume-control {
            background: rgba(30,30,40,0.8);
            border-radius: 32px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #eee;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        select, input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: monospace;
            font-size: 11px;
            outline: none;
            cursor: pointer;
        }
        select option { background: #111; }
        .volume-control input { width: 90px; }
        
        /* fail counter */
        .fail-counter {
            position: fixed;
            top: 70px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-family: monospace;
            color: #ffaa88;
            border: 1px solid #ffaa88;
            pointer-events: none;
            z-index: 25;
        }
        .back-link {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            border: 1px solid #9afc97;
            transition: 0.2s;
        }
        .instruction {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        /* on‑screen number buttons for mobile */
        .number-panel {
            position: fixed;
            bottom: 80px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 8px 16px;
            z-index: 40;
            pointer-events: none;
        }
        .num-btn {
            pointer-events: auto;
            background: rgba(20,20,30,0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 50px;
            width: 52px;
            padding: 10px 0;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            font-family: monospace;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .num-btn:active {
            transform: scale(0.94);
            background: rgba(255,255,255,0.3);
        }
        @media (max-width: 640px) {
            .num-btn { width: 48px; font-size: 20px; padding: 8px 0; }
            .number-panel { gap: 10px; bottom: 70px; }
            .control-panel { gap: 8px; top: 8px; }
            .fail-counter { top: 65px; font-size: 10px; }
        }
        @media (max-width: 480px) {
            .num-btn { width: 42px; font-size: 18px; }
            .number-panel { gap: 8px; }
        }
    </style>
</head>
<body>
<div class="control-panel">
    <div class="band-selector">
        <span style="color:#aaa;">radio band</span>
        <select id="bandSelect">
            <option value="cband">C‑band (4‑8 GHz)</option>
            <option value="kuband">Ku‑band (12‑18 GHz)</option>
            <option value="lband">L‑band (1‑2 GHz)</option>
            <option value="kaband">Ka‑band (26‑40 GHz)</option>
            <option value="xband">X‑band (8‑12 GHz)</option>
        </select>
    </div>
    <div class="volume-control">
        <span style="color:#aaa;">📡 volume</span>
        <input type="range" id="radioVolume" min="0" max="1" step="0.01" value="0.28">
    </div>
</div>
<div class="fail-counter" id="failCounter">failures: 0 / 18</div>
<a href="index.html" class="back-link">← radio</a>
<div class="instruction">tap number buttons → match dots</div>
<div class="number-panel" id="numberPanel">
    <!-- buttons 1-7 will be injected with JS -->
</div>

<script>
    // ================================================================
    // RADIO SIGNAL GAME – mobile friendly with on‑screen number pad
    // No trails – only white outline circles.
    // Target dots 40% smaller.
    // DuckDuckGo / Firefox compatible: ensure audio context starts on user gesture.
    // ================================================================

    let shapes = [];
    let keyMap = {};
    let scaleFreqs = [261.63, 277.18, 329.63, 369.99, 415.30, 466.16, 493.88];
    let reverb, melodicFilter;

    // Background radio noise
    let radioNoise;
    let radioBandFilter;
    let radioGain;
    let radioVolumeSlider;
    let bandSelectEl;
    let radioStarted = false;

    // Game state
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let feedbackTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;
    let baseDelay = 1500;
    let currentDelay = 1500;

    const validKeys = ['1','2','3','4','5','6','7'];
    const numToTone = {1:'A',2:'S',3:'D',4:'F',5:'G',6:'H',7:'J'};

    let failCounterDiv;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);
        
        // Melodic response audio (enigmatic scale)
        reverb = new p5.Reverb();
        reverb.set(4, 2);
        melodicFilter = new p5.LowPass();
        melodicFilter.freq(1200);
        
        let letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        for (let i = 0; i < letters.length; i++) {
            let octave = i < 7 ? 1 : i < 14 ? 2 : 3;
            keyMap[letters[i]] = scaleFreqs[i % scaleFreqs.length] / Math.pow(2, 1 - octave);
        }
        
        // Background radio (band‑limited noise)
        radioNoise = new p5.Noise('brown');
        radioBandFilter = new p5.BandPass();
        radioBandFilter.res(6);
        radioGain = new p5.Gain();
        radioNoise.disconnect();
        radioNoise.connect(radioBandFilter);
        radioBandFilter.connect(radioGain);
        radioGain.connect();
        setBand("cband");
        radioNoise.amp(0.6);
        radioGain.amp(0.28);
        
        bandSelectEl = select('#bandSelect');
        bandSelectEl.changed(() => setBand(bandSelectEl.value()));
        
        radioVolumeSlider = select('#radioVolume');
        radioVolumeSlider.input(() => {
            if (radioGain) radioGain.amp(parseFloat(radioVolumeSlider.value()));
        });
        
        failCounterDiv = select('#failCounter');
        updateFailDisplay();
        
        // Create on-screen number buttons (1-7)
        let panel = select('#numberPanel');
        for (let i = 1; i <= 7; i++) {
            let btn = createButton(str(i));
            btn.addClass('num-btn');
            btn.parent(panel);
            btn.mousePressed(() => handleNumberPress(i));
            btn.touchStarted(() => handleNumberPress(i));
        }
        
        background(0);
    }
    
    // ---------- radio band control ----------
    function setBand(band) {
        let freqHz;
        switch(band) {
            case "cband": freqHz = 6000; break;
            case "kuband": freqHz = 15000; break;
            case "lband": freqHz = 1500; break;
            case "kaband": freqHz = 33000; break;
            case "xband": freqHz = 10000; break;
            default: freqHz = 6000;
        }
        if (radioBandFilter) radioBandFilter.freq(freqHz);
    }
    
    function startRadioBackground() {
        if (radioStarted) return;
        radioStarted = true;
        radioNoise.start();
        radioGain.amp(parseFloat(radioVolumeSlider.value()));
    }
    
    // ---------- visual: floating circles (white outline, no trail, no fill) ----------
    function draw() {
        background(0);
        
        // draw floating circles (only outline, no trail)
        for (let i = shapes.length - 1; i >= 0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;
            
            let level = s.amp.getLevel();
            let ampScale = map(level, 0, 0.3, 0.6, 1.6);
            
            // main circle: white stroke, completely transparent fill
            stroke(255);
            strokeWeight(1.3);
            fill(0, 0);
            circle(s.x, s.y, 24 * ampScale);
            noStroke();
            
            s.opacity -= 1.5;
            if (s.opacity <= 0) {
                if (s.osc) s.osc.amp(0, 1.0);
                setTimeout(() => { if(s.osc) s.osc.stop(); }, 1000);
                shapes.splice(i, 1);
            }
        }
        
        // draw target dots (40% smaller than before)
        drawTargetDots();
        
        // flash feedback
        if (correctFlash > 0) {
            fill(255, 255, 255, correctFlash * 0.3);
            rect(0, 0, width, height);
            correctFlash -= 7;
        }
        
        // game over text
        if (!gameActive) {
            fill(220, 220, 220, 220);
            textAlign(CENTER, CENTER);
            textSize(22);
            textFont('monospace');
            text("signal lost", width/2, height/2 - 40);
            textSize(12);
            text("tap a number to restart", width/2, height/2 + 20);
        }
    }
    
    function drawTargetDots() {
        if (!gameActive) return;
        // 40% smaller than previous (previous was 50px) → now 30px diameter
        let dotDiameter = 30;
        let spacing = 52;
        let total = currentTarget;
        let startX = width/2 - (total-1) * spacing / 2;
        let yPos = height/2;
        
        for (let i = 0; i < total; i++) {
            fill(255, 230);
            noStroke();
            circle(startX + i * spacing, yPos, dotDiameter);
            fill(255, 90);
            circle(startX + i * spacing, yPos, dotDiameter * 0.3);
        }
        
        // speed indicator
        fill(150, 150, 150, 160);
        textSize(10);
        textAlign(CENTER, BOTTOM);
        text("speed: " + (speedLevel + 1), width/2, height/2 - 48);
    }
    
    // melodic tone
    function playToneForNumber(num) {
        let letter = numToTone[num];
        if (!letter) return;
        let freq = keyMap[letter];
        if (!freq) return;
        
        let osc = new p5.Oscillator('triangle');
        osc.freq(freq);
        osc.start();
        osc.amp(0.3, 0.03);
        osc.freq(freq * (1 + random(-0.002, 0.002)));
        osc.disconnect();
        osc.connect(melodicFilter);
        reverb.process(melodicFilter, 2.2, 1.9);
        
        let ampObj = new p5.Amplitude();
        ampObj.setInput(osc);
        
        shapes.push({
            x: random(width),
            y: random(height),
            vx: random(-1.8, 1.8),
            vy: random(-2.2, -0.5),
            osc: osc,
            amp: ampObj,
            opacity: 200
        });
    }
    
    // game logic
    function updateSpeed() {
        currentDelay = max(320, baseDelay - (speedLevel * 55));
    }
    
    function nextRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
    }
    
    function onCorrect() {
        playToneForNumber(currentTarget);
        correctFlash = 110;
        waitingForInput = false;
        if (speedLevel < 18) speedLevel++;
        updateSpeed();
        if (feedbackTimer) clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
            if (gameActive) nextRound();
            feedbackTimer = null;
        }, currentDelay);
    }
    
    function onWrong() {
        failCount++;
        updateFailDisplay();
        correctFlash = 70;
        if (failCount >= 18) {
            gameOver();
            return;
        }
        waitingForInput = true;
    }
    
    function gameOver() {
        gameActive = false;
        waitingForInput = false;
        if (feedbackTimer) clearTimeout(feedbackTimer);
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.4);
        }
        shapes = [];
        failCounterDiv.html("failures: " + failCount + " / 18  ·  signal lost");
    }
    
    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.3);
        }
        shapes = [];
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (feedbackTimer) clearTimeout(feedbackTimer);
    }
    
    function updateFailDisplay() {
        failCounterDiv.html("failures: " + failCount + " / 18");
        if (failCount >= 15) failCounterDiv.style('color', '#ff8888');
        else failCounterDiv.style('color', '#ffaa88');
    }
    
    // handle both keyboard and button presses
    function handleNumberPress(num) {
        // ensure audio context is started (critical for DuckDuckGo / Firefox)
        userStartAudio().then(() => {
            if (!radioStarted) startRadioBackground();
        }).catch(() => {
            // fallback: still try
            if (!radioStarted) startRadioBackground();
        });
        
        if (!radioStarted) startRadioBackground();
        
        if (!gameActive) {
            startGame();
            // after game start, process this same number as input?
            // only if waitingForInput becomes true; but startGame sets waitingForInput = true, so we can call recursively
            setTimeout(() => {
                if (gameActive && waitingForInput) {
                    if (num === currentTarget) onCorrect();
                    else onWrong();
                }
            }, 50);
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) onCorrect();
        else onWrong();
    }
    
    // keyboard support (still works)
    function keyPressed() {
        let k = key;
        if (validKeys.includes(k)) {
            let num = parseInt(k, 10);
            handleNumberPress(num);
            return false;
        }
        if (!gameActive && validKeys.includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        return false;
    }
    
    // touch start to enable audio early
    function touchStarted() {
        userStartAudio().then(() => {
            if (!radioStarted) startRadioBackground();
        }).catch(()=>{});
        return false;
    }
    
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
    }
</script>
</body>
</html>
