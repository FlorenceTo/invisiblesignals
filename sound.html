<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Radio Signal Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: pan-x pan-y;
        }
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 60px;
            pointer-events: auto;
            font-family: monospace;
        }
        .band-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .band-btn {
            background: rgba(30,30,40,0.8);
            border: 1px solid #ff4444;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff8888;
            cursor: pointer;
            transition: 0.1s;
        }
        .band-btn.active {
            background: #9afc9722;
            border-color: #9afc97;
            color: #9afc97;
        }
        .band-btn.muted {
            background: rgba(255,68,68,0.2);
            border-color: #ff4444;
            color: #ff8888;
            text-decoration: line-through;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
        }
        .volume-control span {
            font-size: 11px;
            color: #ffffff;
            font-family: monospace;
        }
        input[type="range"] {
            width: 90px;
            background: #ffffff;
            height: 3px;
            border-radius: 3px;
            -webkit-appearance: none;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }
        .fail-counter {
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff0000;
            border: 1px solid #ff0000;
            white-space: nowrap;
        }
        .back-link {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            border: 1px solid #9afc97;
            transition: 0.2s;
        }
        .instruction {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        .startup-message {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 40px;
            color: #ffffff;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #ffffff;
            max-width: 85%;
            transition: opacity 1s ease;
            white-space: nowrap;
        }
        @media (max-width: 640px) {
            .band-btn { font-size: 9px; padding: 4px 8px; }
            .volume-control input { width: 70px; }
            .fail-counter { font-size: 9px; padding: 4px 8px; }
            .startup-message { font-size: 11px; white-space: normal; width: 90%; padding: 12px 16px; top: 20%; }
        }
        @media (max-width: 480px) {
            .startup-message { font-size: 10px; top: 18%; }
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="band-buttons" id="bandButtons">
        <button class="band-btn active" data-band="cband" data-freq="600">C‑band (600 Hz)</button>
        <button class="band-btn muted" data-band="kuband" data-freq="1800">Ku‑band (1800 Hz)</button>
        <button class="band-btn muted" data-band="lband" data-freq="350">L‑band (350 Hz)</button>
        <button class="band-btn muted" data-band="kaband" data-freq="5000">Ka‑band (5000 Hz)</button>
        <button class="band-btn muted" data-band="xband" data-freq="1000">X‑band (1000 Hz)</button>
    </div>
    <div class="volume-control">
        <span>vol</span>
        <input type="range" id="radioVolume" min="0" max="1" step="0.01" value="0.28">
    </div>
    <div class="fail-counter" id="failCounter">failures 0/18</div>
</div>
<a href="index.html" class="back-link">← radio</a>
<div class="instruction">press keys 1 2 3 4 5 6 7 → match dots</div>
<div id="startupMsg" class="startup-message">Use Firefox browser for best experience<br>press 1 to start</div>

<script>
    // ================================================================
    // FINAL RADIO GAME – C‑band active by default, others off (red).
    // Band mute toggles radio sound + waveform visualization (gray when muted).
    // Number press volume +35%, real‑time frequency ripples.
    // ================================================================

    let shapes = [];           // floating circles from key presses
    let ripples = [];          // real‑time frequency visualization ripples
    let reverb, chorusDelays = [];
    let melodicFilter;
    
    // Just intonation feedback tones (mellow) – volume increased by 35%
    const feedbackFreqs = [110.00, 123.75, 132.00, 137.50, 146.67, 154.66, 165.00];
    
    // Background radio noise
    let radioNoise;
    let radioBandFilter;
    let radioGain;
    let radioVolumeSlider;
    let currentBand = "cband";
    let radioStarted = false;
    let bandMuted = {
        cband: false,
        kuband: true,   // start muted
        lband: true,
        kaband: true,
        xband: true
    };
    let lastVolume = 0.28;
    
    // Visualization variables
    let wavePoints = [];
    let bandFreqDisplay = 600;
    let waveformAlpha = 255;
    
    // Game state
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let feedbackTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;
    let baseDelay = 1500;
    let currentDelay = 1500;
    
    let failCounterDiv;
    let startupMsgDiv;
    
    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);
        
        // Reverb with longer decay
        reverb = new p5.Reverb();
        reverb.set(5, 3);
        
        melodicFilter = new p5.LowPass();
        melodicFilter.freq(2200);
        
        // Background radio (brown noise + bandpass)
        radioNoise = new p5.Noise('brown');
        radioBandFilter = new p5.BandPass();
        radioBandFilter.res(6);
        radioGain = new p5.Gain();
        radioNoise.disconnect();
        radioNoise.connect(radioBandFilter);
        radioBandFilter.connect(radioGain);
        radioGain.connect();
        
        setBand("cband");
        radioNoise.amp(0.6);
        radioGain.amp(lastVolume);
        
        radioVolumeSlider = select('#radioVolume');
        radioVolumeSlider.input(() => {
            let vol = parseFloat(radioVolumeSlider.value());
            lastVolume = vol;
            if (!bandMuted[currentBand]) radioGain.amp(vol);
        });
        
        // Band buttons – toggle mute on/off
        let bandBtns = selectAll('.band-btn');
        for (let btn of bandBtns) {
            btn.mousePressed(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
            });
            btn.touchStarted(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
                return false;
            });
        }
        
        failCounterDiv = select('#failCounter');
        updateFailDisplay();
        
        startupMsgDiv = select('#startupMsg');
        
        // Initialize wave points for visualization
        for (let i = 0; i <= width; i += 8) {
            wavePoints.push({x: i, y: height/2});
        }
        
        background(0);
    }
    
    function toggleBand(band) {
        bandMuted[band] = !bandMuted[band];
        let btn = select(`.band-btn[data-band="${band}"]`);
        
        // If this band is the current active band, update gain and waveform appearance
        if (currentBand === band) {
            if (bandMuted[band]) {
                radioGain.amp(0);
                btn.addClass('muted');
                btn.removeClass('active');
                waveformAlpha = 80;  // dim waveform
            } else {
                radioGain.amp(lastVolume);
                btn.removeClass('muted');
                btn.addClass('active');
                waveformAlpha = 255;
            }
        } else {
            // Just update button state
            if (bandMuted[band]) {
                btn.addClass('muted');
                btn.removeClass('active');
            } else {
                btn.removeClass('muted');
                // Not active because it's not the current band
                btn.removeClass('active');
            }
        }
        
        // If band is unmuted and it's not the current band, switch to it
        if (!bandMuted[band] && currentBand !== band) {
            setBand(band);
            radioGain.amp(lastVolume);
            waveformAlpha = 255;
        }
        
        // If we muted the current band, remove active class and dim wave
        if (bandMuted[band] && currentBand === band) {
            btn.removeClass('active');
            waveformAlpha = 80;
        } else if (!bandMuted[band] && currentBand === band) {
            waveformAlpha = 255;
        }
    }
    
    function setBand(band) {
        currentBand = band;
        let freqHz;
        switch(band) {
            case "cband":  freqHz = 600; break;
            case "kuband": freqHz = 1800; break;
            case "lband":  freqHz = 350; break;
            case "kaband": freqHz = 5000; break;
            case "xband":  freqHz = 1000; break;
            default: freqHz = 600;
        }
        bandFreqDisplay = freqHz;
        if (radioBandFilter) radioBandFilter.freq(freqHz);
        if (!bandMuted[band] && radioStarted) radioGain.amp(lastVolume);
        else if (bandMuted[band]) radioGain.amp(0);
        
        // Update button active states
        for (let b of selectAll('.band-btn')) {
            let bband = b.attribute('data-band');
            if (bband === band && !bandMuted[band]) {
                b.addClass('active');
                b.removeClass('muted');
            } else if (bband === band && bandMuted[band]) {
                b.addClass('muted');
                b.removeClass('active');
            } else {
                b.removeClass('active');
            }
        }
        waveformAlpha = bandMuted[band] ? 80 : 255;
    }
    
    function startRadioBackground() {
        if (radioStarted) return;
        radioStarted = true;
        radioNoise.start();
        if (!bandMuted[currentBand]) radioGain.amp(lastVolume);
        else radioGain.amp(0);
    }
    
    function dismissStartupMessage() {
        if (startupMsgDiv && startupMsgDiv.elt) {
            startupMsgDiv.style('opacity', '0');
            setTimeout(() => {
                if (startupMsgDiv && startupMsgDiv.elt) startupMsgDiv.remove();
            }, 1000);
        }
    }
    
    // ----- Generative frequency visualization with band mute awareness -----
    function drawVisualization() {
        let freq = bandFreqDisplay;
        let amplitude = 45 + 15 * sin(frameCount * 0.015);
        if (waveformAlpha < 200) amplitude *= 0.3; // reduce when muted
        
        let phase = frameCount * (freq / 1800.0);
        for (let i = 0; i < wavePoints.length; i++) {
            let x = wavePoints[i].x;
            let y = height/2 + sin(x * freq / 7000.0 + phase) * amplitude + cos(x * freq / 11000.0) * (amplitude * 0.6);
            wavePoints[i].y = y;
        }
        
        let waveColor = bandMuted[currentBand] ? [100,100,100] : [154,252,151];
        stroke(waveColor[0], waveColor[1], waveColor[2], waveformAlpha);
        strokeWeight(2);
        noFill();
        beginShape();
        for (let p of wavePoints) vertex(p.x, p.y);
        endShape();
        
        fill(waveColor[0], waveColor[1], waveColor[2], 200);
        noStroke();
        textAlign(RIGHT, TOP);
        textSize(12);
        textFont('monospace');
        text(`${currentBand.toUpperCase()} ${bandFreqDisplay} Hz`, width - 20, 65);
        
        // particles
        stroke(waveColor[0], waveColor[1], waveColor[2], 150);
        strokeWeight(1.2);
        for (let i = 0; i < (waveformAlpha > 200 ? 35 : 10); i++) {
            let x = (frameCount * (freq / 1800) + i * 55) % width;
            let y = height/2 + sin(x * freq / 2800 + frameCount * 0.04) * 22 * (waveformAlpha/255);
            point(x, y);
        }
    }
    
    // ----- Real‑time frequency ripples on each key press -----
    function addFrequencyRipple(noteFreq) {
        let ripple = {
            x: width/2,
            y: height/2,
            radius: 20,
            maxRadius: min(width,height) * 0.8,
            life: 255,
            freq: noteFreq
        };
        ripples.push(ripple);
    }
    
    // Extended chorus effect with higher volume (+35%)
    function playFeedbackTone(num) {
        let baseFreq = feedbackFreqs[num-1];
        if (!baseFreq) return;
        
        // Add real‑time ripple visualization
        addFrequencyRipple(baseFreq);
        
        let volumeBoost = 1.35; // +35%
        let env = new p5.Envelope();
        env.setADSR(0.02, 0.15, 0.6, 1.2);
        env.setRange(0.22 * volumeBoost, 0);
        
        let detunes = [0, 7, -5];
        let voices = [];
        for (let i = 0; i < detunes.length; i++) {
            let osc = new p5.Oscillator('sine');
            let cents = detunes[i];
            let freq = baseFreq * Math.pow(2, cents / 1200);
            osc.freq(freq);
            osc.start();
            env.play(osc);
            osc.disconnect();
            osc.connect(melodicFilter);
            voices.push(osc);
        }
        
        melodicFilter.disconnect();
        melodicFilter.connect(reverb);
        reverb.process(melodicFilter, 3.5, 2.5);
        
        let ampObj = new p5.Amplitude();
        ampObj.setInput(voices[0]);
        
        shapes.push({
            x: random(width),
            y: random(height),
            vx: random(-1.8, 1.8),
            vy: random(-2.2, -0.5),
            osc: voices[0],
            amp: ampObj,
            opacity: 200,
            extraOscs: voices.slice(1)
        });
        
        setTimeout(() => {
            for (let v of voices) v.stop();
            let idx = shapes.findIndex(s => s.osc === voices[0]);
            if (idx !== -1) shapes.splice(idx,1);
        }, 1800);
    }
    
    // Draw ripples
    function drawRipples() {
        for (let i = ripples.length-1; i >= 0; i--) {
            let r = ripples[i];
            r.radius += 6;
            r.life -= 5;
            if (r.radius > r.maxRadius || r.life <= 0) {
                ripples.splice(i,1);
                continue;
            }
            noFill();
            stroke(154,252,151, r.life);
            strokeWeight(2);
            circle(r.x, r.y, r.radius * 2);
            // inner ring for frequency representation
            let innerRadius = r.radius * (r.freq / 300);
            stroke(255, 200, 100, r.life * 0.6);
            circle(r.x, r.y, innerRadius * 2);
        }
    }
    
    // game logic
    function updateSpeed() {
        currentDelay = max(320, baseDelay - (speedLevel * 55));
    }
    
    function nextRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
    }
    
    function onCorrect() {
        playFeedbackTone(currentTarget);
        correctFlash = 110;
        waitingForInput = false;
        if (speedLevel < 18) speedLevel++;
        updateSpeed();
        if (feedbackTimer) clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
            if (gameActive) nextRound();
            feedbackTimer = null;
        }, currentDelay);
    }
    
    function onWrong() {
        failCount++;
        updateFailDisplay();
        correctFlash = 70;
        if (failCount >= 18) {
            gameOver();
            return;
        }
        waitingForInput = true;
    }
    
    function gameOver() {
        gameActive = false;
        waitingForInput = false;
        if (feedbackTimer) clearTimeout(feedbackTimer);
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.3);
            if (s.extraOscs) for (let o of s.extraOscs) o.amp(0,0.3);
        }
        shapes = [];
        ripples = [];
        failCounterDiv.html("failures 18/18 · lost");
    }
    
    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.3);
        }
        shapes = [];
        ripples = [];
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (feedbackTimer) clearTimeout(feedbackTimer);
    }
    
    function updateFailDisplay() {
        failCounterDiv.html("failures " + failCount + "/18");
    }
    
    function draw() {
        background(0);
        drawVisualization();
        drawRipples();
        
        for (let i = shapes.length-1; i >= 0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;
            let level = s.amp.getLevel();
            let ampScale = map(level, 0, 0.3, 0.6, 1.6);
            stroke(255);
            strokeWeight(1.3);
            fill(0, 0);
            circle(s.x, s.y, 24 * ampScale);
            noStroke();
            s.opacity -= 1.5;
            if (s.opacity <= 0) {
                if (s.osc) s.osc.amp(0, 0.8);
                shapes.splice(i,1);
            }
        }
        
        drawTargetDots();
        
        if (correctFlash > 0) {
            fill(255, 255, 255, correctFlash * 0.25);
            rect(0, 0, width, height);
            correctFlash -= 6;
        }
        
        if (!gameActive) {
            fill(200, 200, 200, 220);
            textAlign(CENTER, CENTER);
            textSize(20);
            textFont('monospace');
            text("signal lost", width/2, height/2 - 40);
            textSize(12);
            text("press a number key (1-7) to restart", width/2, height/2 + 20);
        }
    }
    
    function drawTargetDots() {
        if (!gameActive) return;
        let dotDiameter = 28;
        let spacing = 50;
        let total = currentTarget;
        let startX = width/2 - (total-1) * spacing / 2;
        let yPos = height/2;
        for (let i = 0; i < total; i++) {
            fill(255, 220);
            noStroke();
            circle(startX + i * spacing, yPos, dotDiameter);
            fill(255, 80);
            circle(startX + i * spacing, yPos, dotDiameter * 0.3);
        }
        fill(160, 160, 160, 200);
        textSize(10);
        textAlign(CENTER, BOTTOM);
        textFont('monospace');
        text("speed: " + (speedLevel + 1), width/2, height/2 - 48);
    }
    
    function handleNumberPress(num) {
        dismissStartupMessage();
        userStartAudio().then(() => {
            if (!radioStarted) startRadioBackground();
        }).catch(() => { if (!radioStarted) startRadioBackground(); });
        if (!radioStarted) startRadioBackground();
        
        if (!gameActive) {
            startGame();
            setTimeout(() => {
                if (gameActive && waitingForInput) {
                    if (num === currentTarget) onCorrect();
                    else onWrong();
                }
            }, 50);
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) onCorrect();
        else onWrong();
    }
    
    function keyPressed() {
        let k = key;
        if (['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        if (!gameActive && ['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        return false;
    }
    
    function touchStarted() {
        userStartAudio().catch(()=>{});
        return false;
    }
    
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
        wavePoints = [];
        for (let i = 0; i <= width; i += 8) wavePoints.push({x: i, y: height/2});
    }
</script>
</body>
</html>
