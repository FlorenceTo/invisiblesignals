<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sound Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Inter', 'Monument Grotesk Variable', monospace;
        }
        .top-bar {
            position: fixed;
            top: 16px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 0 12px;
        }
        .instruction {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-family: monospace;
            color: #9afc97;
            border: 1px solid #9afc97;
            pointer-events: none;
        }
        .fail-counter {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-family: monospace;
            color: #ff8888;
            border: 1px solid #ff8888;
            pointer-events: none;
        }
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            border: 1px solid #9afc97;
            transition: 0.2s;
        }
        .back-link:active {
            background: #9afc9722;
        }
        @media (max-width: 640px) {
            .instruction, .fail-counter { font-size: 10px; padding: 4px 10px; }
            .back-link { font-size: 10px; bottom: 16px; left: 12px; }
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="instruction">dots = number &nbsp;&nbsp;|&nbsp;&nbsp; press keys 1 2 3 4 5 6 7</div>
    <div class="fail-counter" id="failCounter">failures: 0 / 18</div>
</div>
<a href="index.html" class="back-link">← radio</a>

<script>
    // --------------------------------------------------------------
    // NUMBER DOT GAME (keys 1-7)
    // Speed increases after each success. 18 failures = game over.
    // Visuals: circles only (no sperm-like ellipses). Preserve trail & glow.
    // --------------------------------------------------------------

    let shapes = [];           // visual circles from key presses
    let keyMap = {};          // map number keys to frequencies (using enigmatic scale)
    let scaleFreqs = [261.63, 277.18, 329.63, 369.99, 415.30, 466.16, 493.88];
    let reverb;
    let filter;

    // Game state
    let gameActive = false;
    let currentTarget = 1;          // number of dots (1-7)
    let waitingForInput = true;
    let feedbackTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;             // 0 = slowest, increases with correct answers
    let baseDelay = 1500;           // initial delay before next round (ms)
    let currentDelay = 1500;

    // Mapping: key number (as string) -> target value (1-7)
    const validKeys = ['1','2','3','4','5','6','7'];
    const numToTone = {1:'A',2:'S',3:'D',4:'F',5:'G',6:'H',7:'J'}; // for sound mapping

    // UI elements
    let failCounterDiv;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);

        // Audio setup
        reverb = new p5.Reverb();
        reverb.set(4, 2);
        filter = new p5.LowPass();
        filter.freq(1200);

        // Map all letters to frequencies (enigmatic scale) for sound generation
        let letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        for (let i = 0; i < letters.length; i++) {
            let octave = i < 7 ? 1 : i < 14 ? 2 : 3;
            keyMap[letters[i]] = scaleFreqs[i % scaleFreqs.length] / Math.pow(2, 1 - octave);
        }

        failCounterDiv = select('#failCounter');
        updateFailDisplay();
    }

    function draw() {
        background(0);

        // Draw floating circles (trail and glow)
        for (let i = shapes.length - 1; i >= 0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;

            let level = s.amp.getLevel();
            let ampScale = map(level, 0, 0.3, 0.5, 2);

            // Draw trail (circles)
            s.trail.push({x: s.x, y: s.y, opacity: 255});
            if (s.trail.length > 25) s.trail.shift();
            for (let t of s.trail) {
                fill(255, t.opacity);
                circle(t.x, t.y, 18 * ampScale);
                t.opacity -= 5;
            }

            // Glow (reddish, as in original)
            if (s.glow > 0) {
                fill(255, 50, 50, s.glow);
                circle(s.x, s.y, 34 * ampScale);
                s.glow *= 0.92;
            }

            // Main circle (white outline, semi-transparent fill)
            stroke(255);
            strokeWeight(1.5);
            fill(255, s.opacity);
            circle(s.x, s.y, 28 * ampScale);
            noStroke();

            s.opacity -= 1;
            if (s.opacity <= 0) {
                s.osc.amp(0, 1.2);
                setTimeout(() => s.osc.stop(), 1400);
                shapes.splice(i, 1);
            }
        }

        // Draw target dots (center)
        drawTargetDots();

        // Draw correct/incorrect flash
        if (correctFlash > 0) {
            fill(154, 252, 151, correctFlash * 0.7);
            rect(0, 0, width, height);
            correctFlash -= 8;
        }

        // Game over message overlay if inactive
        if (!gameActive) {
            fill(255, 255, 255, 200);
            textAlign(CENTER, CENTER);
            textSize(24);
            textFont('monospace');
            text("GAME OVER", width/2, height/2 - 40);
            textSize(14);
            text("press any number key to restart", width/2, height/2 + 20);
        }
    }

    function drawTargetDots() {
        if (!gameActive) return;

        let dotDiameter = 50;
        let spacing = 75;
        let totalDots = currentTarget;
        let startX = width/2 - (totalDots-1) * spacing / 2;
        let yPos = height/2;

        for (let i = 0; i < totalDots; i++) {
            fill(154, 252, 151, 230);
            noStroke();
            circle(startX + i * spacing, yPos, dotDiameter);
            // inner highlight
            fill(255, 255, 255, 200);
            circle(startX + i * spacing, yPos, dotDiameter * 0.4);
        }

        // small speed indicator (optional)
        fill(154, 252, 151, 120);
        textSize(12);
        textAlign(CENTER, BOTTOM);
        text("speed: " + (speedLevel + 1), width/2, height/2 - 60);
    }

    // Play a tone for a given number (1-7)
    function playToneForNumber(num) {
        let letter = numToTone[num];
        if (!letter) return;
        let freq = keyMap[letter];
        if (!freq) return;

        let osc = new p5.Oscillator('triangle');
        osc.freq(freq);
        osc.start();
        osc.amp(0.3, 0.05);
        osc.freq(freq * (1 + random(-0.002, 0.002)));

        osc.disconnect();
        osc.connect(filter);
        reverb.process(filter, 2, 2);

        let amp = new p5.Amplitude();
        amp.setInput(osc);

        // Create a circle visual (no ellipses)
        let s = {
            x: random(width),
            y: random(height),
            vx: random(-2, 2),
            vy: random(-2, 2),
            osc: osc,
            amp: amp,
            opacity: 255,
            trail: [],
            glow: 250
        };
        shapes.push(s);
    }

    // Update speed (delay between rounds) based on correct answers
    function updateSpeed() {
        // speedLevel increases with each correct answer (capped)
        let newDelay = baseDelay - (speedLevel * 60);
        if (newDelay < 300) newDelay = 300;
        currentDelay = newDelay;
    }

    // Generate next target
    function nextRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        // update status via fail counter color? not needed
    }

    // Correct answer
    function onCorrect() {
        playToneForNumber(currentTarget);
        correctFlash = 150;
        waitingForInput = false;

        // Increase speed level (max 15)
        if (speedLevel < 18) speedLevel++;
        updateSpeed();

        // Clear any pending timer
        if (feedbackTimer) clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
            if (gameActive) nextRound();
            feedbackTimer = null;
        }, currentDelay);
    }

    // Wrong answer: increase fail counter, check loss
    function onWrong() {
        failCount++;
        updateFailDisplay();

        // visual red flash
        correctFlash = 80;
        fill(255, 80, 80, 100);
        rect(0, 0, width, height);

        if (failCount >= 18) {
            gameOver();
            return;
        }

        // Keep same target, allow retry
        waitingForInput = true;
        // brief status (no permanent message, but we can blink fail counter)
        setTimeout(() => {
            if (gameActive && waitingForInput) {
                // do nothing
            }
        }, 400);
    }

    function gameOver() {
        gameActive = false;
        waitingForInput = false;
        if (feedbackTimer) clearTimeout(feedbackTimer);
        // clear all shapes
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.5);
        }
        shapes = [];
        failCounterDiv.html("failures: " + failCount + " / 18  GAME OVER");
    }

    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        // clear any remaining shapes
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.5);
        }
        shapes = [];
        // random first target
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (feedbackTimer) clearTimeout(feedbackTimer);
    }

    function updateFailDisplay() {
        if (failCounterDiv) {
            failCounterDiv.html("failures: " + failCount + " / 18");
            if (failCount >= 15) failCounterDiv.style('color', '#ff5555');
            else failCounterDiv.style('color', '#ff8888');
        }
    }

    // Handle number key press
    function handleKey(numStr) {
        let num = parseInt(numStr, 10);
        if (isNaN(num) || num < 1 || num > 7) return;

        if (!gameActive) {
            // restart
            userStartAudio();
            startGame();
            return;
        }

        if (!waitingForInput) return;

        if (num === currentTarget) {
            onCorrect();
        } else {
            onWrong();
        }
    }

    // p5 keyPressed
    function keyPressed() {
        let k = key;
        // accept numeric keys 1-7
        if (validKeys.includes(k)) {
            userStartAudio();
            handleKey(k);
            return false;
        }
        // also accept numpad? but fine
        // restart if game over and any key pressed
        if (!gameActive && (k === ' ' || k === 'Enter' || validKeys.includes(k))) {
            userStartAudio();
            startGame();
            return false;
        }
        return false;
    }

    // Touch start to enable audio but not auto-start game
    function touchStarted() {
        userStartAudio();
        if (!gameActive) {
            // optional: show instruction but don't start until key press
        }
        return false;
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
    }
</script>
</body>
</html>
