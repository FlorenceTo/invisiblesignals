<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sound Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0c12;
            overflow: hidden;
            font-family: 'Inter', 'Monument Grotesk Variable', monospace;
            color: #e3ffa9;
        }
        .game-ui {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #9afc97;
            font-size: 1.1rem;
            font-family: monospace;
            white-space: nowrap;
            pointer-events: none;
            z-index: 20;
            color: #9afc97;
        }
        .score-board {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-family: monospace;
            font-size: 1.2rem;
            border-left: 3px solid #9afc97;
            pointer-events: none;
            z-index: 20;
            color: #9afc97;
        }
        .status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-family: monospace;
            pointer-events: none;
            z-index: 20;
        }
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            border: 1px solid #9afc97;
            transition: 0.2s;
        }
        .back-link:active {
            background: #9afc9722;
        }
        .instruction {
            position: fixed;
            bottom: 85px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #9afc97;
            opacity: 0.7;
            pointer-events: none;
            font-family: monospace;
        }
        @media (max-width: 640px) {
            .game-ui { font-size: 0.9rem; padding: 0.4rem 1rem; bottom: 16px; }
            .score-board { font-size: 1rem; top: 12px; right: 12px; }
            .status { font-size: 0.7rem; top: 12px; left: 12px; }
            .back-link { bottom: 16px; left: 12px; font-size: 0.7rem; }
            .instruction { bottom: 70px; font-size: 0.6rem; }
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div class="score-board">SCORE: <span id="scoreValue">0</span></div>
<div class="status" id="gameStatus">ready</div>
<div class="game-ui">
    <span id="displayNote">press a key</span>
</div>
<a href="index.html" class="back-link">radio</a>
<div class="instruction">keys: a s d f g h j  (enigmatic scale)</div>

<script>
    // --------------------------------------------------------------
    // ORIGINAL GAME LOGIC (sequence memory) - NO STARS, NO TRIANGLES
    // Visuals: rotating diamonds / squares only (no ellipses)
    // Enigmatic scale frequencies
    // GPU safe: max 60 particles, frameRate(60)
    // --------------------------------------------------------------
    
    let shapes = [];
    let keyMap = {};
    let reverb, filter;
    
    // Enigmatic scale (as provided)
    let scaleFreqs = [261.63, 277.18, 329.63, 369.99, 415.30, 466.16, 493.88];
    
    // Game state
    let currentSequence = [];
    let playerInput = [];
    let score = 0;
    let roundActive = false;
    let waitingForInput = false;
    let gameStarted = false;
    let currentNoteIndex = 0;
    
    const keyLetters = ['A', 'S', 'D', 'F', 'G', 'H', 'J'];
    let keyToIndex = {};
    
    // UI elements
    let scoreSpan, statusDiv, displaySpan;
    
    // Limit particles to avoid GPU overload
    const MAX_PARTICLES = 60;
    
    function setup() {
        createCanvas(windowWidth, windowHeight);
        frameRate(60); // stable pace, prevent overloading
        noStroke();
        
        // Audio setup
        reverb = new p5.Reverb();
        reverb.set(3.5, 2.0);
        filter = new p5.LowPass();
        filter.freq(1400);
        
        // Map keys
        for (let i = 0; i < keyLetters.length; i++) {
            keyMap[keyLetters[i]] = scaleFreqs[i];
            keyToIndex[keyLetters[i]] = i;
        }
        
        scoreSpan = select('#scoreValue');
        statusDiv = select('#gameStatus');
        displaySpan = select('#displayNote');
        
        // Wait for user interaction to start (audio context)
        statusDiv.html("press any key");
        displaySpan.html("start");
        gameStarted = false;
    }
    
    function startGame() {
        if (gameStarted) return;
        gameStarted = true;
        score = 0;
        currentSequence = [];
        playerInput = [];
        updateScoreUI();
        startNewRound();
        statusDiv.html("new round");
    }
    
    function startNewRound() {
        if (!gameStarted) return;
        roundActive = true;
        waitingForInput = false;
        playerInput = [];
        let newNote = floor(random(0, keyLetters.length));
        currentSequence.push(newNote);
        playSequence();
    }
    
    function playSequence() {
        currentNoteIndex = 0;
        roundActive = false;
        waitingForInput = false;
        let interval = setInterval(() => {
            if (!gameStarted) {
                clearInterval(interval);
                return;
            }
            if (currentNoteIndex >= currentSequence.length) {
                clearInterval(interval);
                roundActive = false;
                waitingForInput = true;
                statusDiv.html("your turn");
                displaySpan.html("?");
                return;
            }
            let noteIdx = currentSequence[currentNoteIndex];
            let keyChar = keyLetters[noteIdx];
            playTone(keyChar);
            addVisualShape(noteIdx);
            displaySpan.html(keyChar);
            currentNoteIndex++;
        }, 550);
    }
    
    function playTone(keyChar) {
        let freq = keyMap[keyChar];
        if (!freq) return;
        let osc = new p5.Oscillator('triangle');
        osc.freq(freq);
        osc.start();
        osc.amp(0.28, 0.02);
        // slight detune for depth
        osc.freq(freq * (1 + random(-0.0015, 0.0015)));
        osc.disconnect();
        osc.connect(filter);
        reverb.process(filter, 1.8, 1.5);
        let ampObj = new p5.Amplitude();
        ampObj.setInput(osc);
        
        // Create a visual particle (diamond/square) - no ellipses, no stars, no triangles
        addParticle(osc, ampObj);
        
        // fade out after a second
        setTimeout(() => {
            if (osc) osc.amp(0, 0.6);
        }, 1000);
    }
    
    function addParticle(osc, ampObj) {
        // limit particle count to avoid GPU overload
        if (shapes.length > MAX_PARTICLES) {
            let oldest = shapes.shift();
            if (oldest.osc) oldest.osc.amp(0, 0.3);
        }
        let col = [154, 252, 151]; // green #9afc97
        let shapeType = (random() > 0.5) ? 'diamond' : 'square';
        shapes.push({
            x: random(width * 0.2, width * 0.8),
            y: random(height * 0.3, height * 0.7),
            vx: random(-1.2, 1.2),
            vy: random(-2.0, -0.5),
            life: 180,
            col: col,
            type: shapeType,
            rot: random(TWO_PI),
            osc: osc,
            amp: ampObj,
            glow: 120
        });
    }
    
    function addVisualShape(noteIdx) {
        // burst effect without ellipses
        if (shapes.length > MAX_PARTICLES) return;
        let burst = {
            x: random(width * 0.3, width * 0.7),
            y: random(height * 0.4, height * 0.6),
            vx: random(-0.8, 0.8),
            vy: random(-1.2, -0.2),
            life: 100,
            col: [200, 255, 180],
            type: 'square',
            rot: 0,
            glow: 100,
            amp: null
        };
        shapes.push(burst);
    }
    
    function handlePlayerInput(keyChar) {
        if (!gameStarted) {
            userStartAudio();
            startGame();
            // after a tiny delay, process this same key if needed
            setTimeout(() => {
                if (gameStarted && waitingForInput) handlePlayerInput(keyChar);
            }, 100);
            return;
        }
        if (!waitingForInput) return;
        
        let expectedIdx = currentSequence[playerInput.length];
        let pressedIdx = keyToIndex[keyChar];
        if (pressedIdx === undefined) return;
        
        // play tone anyway for feedback
        playTone(keyChar);
        
        if (pressedIdx === expectedIdx) {
            playerInput.push(pressedIdx);
            statusDiv.html("correct");
            
            // add a small celebratory square
            if (shapes.length < MAX_PARTICLES) {
                shapes.push({
                    x: mouseX || width/2, y: mouseY || height/2,
                    vx: random(-1,1), vy: random(-1.5,-0.3),
                    life: 90, col: [154,252,151], type: 'diamond', rot: 0, glow: 100
                });
            }
            
            if (playerInput.length === currentSequence.length) {
                score++;
                updateScoreUI();
                statusDiv.html("round complete");
                waitingForInput = false;
                displaySpan.html("ok");
                setTimeout(() => {
                    if (gameStarted) startNewRound();
                }, 800);
            } else {
                setTimeout(() => {
                    if (waitingForInput && gameStarted) statusDiv.html("your turn");
                }, 500);
            }
        } else {
            // wrong note: game over
            statusDiv.html("game over");
            displaySpan.html("x");
            gameStarted = false;
            waitingForInput = false;
            roundActive = false;
            currentSequence = [];
            playerInput = [];
            score = 0;
            updateScoreUI();
            // kill all oscillators gently
            for (let s of shapes) {
                if (s.osc) s.osc.amp(0, 0.3);
            }
            shapes = [];
            setTimeout(() => {
                if (!gameStarted) {
                    statusDiv.html("press any key");
                    displaySpan.html("restart");
                }
            }, 1500);
        }
    }
    
    function updateScoreUI() {
        if (scoreSpan) scoreSpan.html(score);
    }
    
    // ---------- DRAW: only diamonds and squares (no ellipses, stars, triangles) ----------
    function draw() {
        background(0, 0, 0, 35); // trailing effect
        
        // update and draw each particle
        for (let i = shapes.length-1; i >= 0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;
            s.life -= 2.2;
            
            let ampScale = 1.0;
            if (s.amp) {
                let level = s.amp.getLevel();
                ampScale = map(level, 0, 0.25, 0.7, 1.6);
            }
            
            push();
            translate(s.x, s.y);
            rotate(s.rot + frameCount * 0.02);
            let alphaVal = constrain(s.life, 0, 220);
            fill(s.col[0], s.col[1], s.col[2], alphaVal);
            noStroke();
            
            let sizeBase = 22 * ampScale;
            if (s.type === 'diamond') {
                drawDiamond(0, 0, sizeBase);
            } else { // square
                drawSquare(0, 0, sizeBase);
            }
            pop();
            
            // subtle glow (greenish)
            if (s.glow > 0) {
                push();
                translate(s.x, s.y);
                fill(154, 252, 151, s.glow * 0.25);
                noStroke();
                // simple rectangle glow (not ellipse)
                rectMode(CENTER);
                rect(0, 0, sizeBase * 1.4, sizeBase * 1.4);
                s.glow -= 6;
                pop();
            }
            
            if (s.life <= 0) {
                if (s.osc) {
                    s.osc.amp(0, 0.4);
                    setTimeout(() => { if(s.osc) s.osc.stop(); }, 500);
                }
                shapes.splice(i,1);
            }
        }
        
        // draw a subtle wave line (low GPU)
        drawWaveGuide();
    }
    
    // Diamond shape (angular, safe)
    function drawDiamond(x, y, size) {
        let half = size / 2;
        beginShape();
        vertex(x, y - half);
        vertex(x + half * 0.85, y);
        vertex(x, y + half);
        vertex(x - half * 0.85, y);
        endShape(CLOSE);
    }
    
    // Square shape (neutral)
    function drawSquare(x, y, size) {
        let r = size / 2;
        rectMode(CENTER);
        rect(x, y, size, size);
    }
    
    function drawWaveGuide() {
        strokeWeight(1);
        stroke(154, 252, 151, 60);
        noFill();
        beginShape();
        for (let x = 0; x < width; x += 50) {
            let y = height/2 + sin(x * 0.008 + frameCount * 0.02) * 35;
            vertex(x, y);
        }
        endShape();
    }
    
    // ---- Keyboard interaction ----
    function keyPressed() {
        let k = key.toUpperCase();
        if (keyLetters.includes(k)) {
            userStartAudio();
            handlePlayerInput(k);
            return false;
        }
        // any key to restart when game over
        if (!gameStarted) {
            userStartAudio();
            startGame();
            return false;
        }
        return false;
    }
    
    // Touch support for mobile (same as key)
    function touchStarted() {
        userStartAudio();
        if (!gameStarted) {
            startGame();
        }
        return false;
    }
    
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
    }
</script>
</body>
</html>
