<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Radio Signal Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: pan-x pan-y;
        }
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 60px;
            pointer-events: auto;
            font-family: monospace;
        }
        .band-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .band-btn {
            background: rgba(30,30,40,0.8);
            border: 1px solid #ff4444;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff8888;
            cursor: pointer;
            transition: 0.1s;
        }
        .band-btn.active {
            background: #9afc9722;
            border-color: #9afc97;
            color: #9afc97;
        }
        .band-btn.muted {
            background: rgba(255,68,68,0.2);
            border-color: #ff4444;
            color: #ff8888;
            text-decoration: line-through;
        }
        .all-on-btn {
            background: rgba(30,30,40,0.8);
            border: 1px solid #9afc97;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #9afc97;
            cursor: pointer;
            transition: 0.1s;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
        }
        .volume-control span {
            font-size: 11px;
            color: #ffffff;
            font-family: monospace;
        }
        input[type="range"] {
            width: 90px;
            background: #ffffff;
            height: 3px;
            border-radius: 3px;
            -webkit-appearance: none;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }
        .fail-counter {
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff0000;
            border: 1px solid #ff0000;
            white-space: nowrap;
        }
        .back-link {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            border: 1px solid #9afc97;
            transition: 0.2s;
        }
        .instruction {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        .startup-message {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 40px;
            color: #ffffff;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #ffffff;
            max-width: 85%;
            transition: opacity 1s ease;
            white-space: nowrap;
        }
        @media (max-width: 640px) {
            .band-btn, .all-on-btn { font-size: 9px; padding: 4px 8px; }
            .volume-control input { width: 70px; }
            .fail-counter { font-size: 9px; padding: 4px 8px; }
            .startup-message { font-size: 11px; white-space: normal; width: 90%; padding: 12px 16px; top: 20%; }
        }
        @media (max-width: 480px) {
            .startup-message { font-size: 10px; top: 18%; }
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="band-buttons" id="bandButtons">
        <button class="band-btn active" data-band="cband" data-freq="600">C‑band (600 Hz)</button>
        <button class="band-btn muted" data-band="kuband" data-freq="1800">Ku‑band (1800 Hz)</button>
        <button class="band-btn muted" data-band="lband" data-freq="350">L‑band (350 Hz)</button>
        <button class="band-btn muted" data-band="kaband" data-freq="5000">Ka‑band (5000 Hz)</button>
        <button class="band-btn muted" data-band="xband" data-freq="1000">X‑band (1000 Hz)</button>
        <button id="allOnBtn" class="all-on-btn">All On</button>
    </div>
    <div class="volume-control">
        <span>vol</span>
        <input type="range" id="radioVolume" min="0" max="1" step="0.01" value="0.28">
    </div>
    <div class="fail-counter" id="failCounter">failures 0/18</div>
</div>
<a href="index.html" class="back-link">← radio</a>
<div class="instruction">press keys 1 2 3 4 5 6 7 → match dots</div>
<div id="startupMsg" class="startup-message">Use Firefox browser for best experience<br>press 1 to start</div>

<script>
    // ================================================================
    // RADIO GAME – All Bands On (parallel filters mix),
    // visualization 40% brighter, white particles,
    // chorus intensity reduced 20% for louder notes.
    // ================================================================

    let shapes = [];
    let ripples = [];
    let reverb, melodicFilter;
    
    // Feedback frequencies raised by 5 semitones
    const baseFeedbackFreqs = [110.00, 123.75, 132.00, 137.50, 146.67, 154.66, 165.00];
    const feedbackFreqs = baseFeedbackFreqs.map(f => f * 1.33483985417);
    
    // Multi‑band radio mixer
    let radioNoise;
    let bandFilters = {};        // one BandPass per band
    let bandGains = {};          // Gain nodes for each band
    let masterGain;
    let radioStarted = false;
    let lastVolume = 0.28;
    let allOnMode = false;       // when true, all bands are active simultaneously
    
    // Band frequencies and state
    const bands = {
        cband: { freq: 600, active: true, color: [154,252,151] },
        kuband: { freq: 1800, active: false, color: [154,252,151] },
        lband: { freq: 350, active: false, color: [154,252,151] },
        kaband: { freq: 5000, active: false, color: [154,252,151] },
        xband: { freq: 1000, active: false, color: [154,252,151] }
    };
    let currentBand = "cband";   // for visualization and solo mode, but all‑on overrides
    
    // Visualization
    let wavePoints = [];
    let bandFreqDisplay = 600;
    let waveformBrightness = 1.0; // 40% brighter = multiplier 1.4
    
    // Game state
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let feedbackTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;
    let baseDelay = 1500;
    let currentDelay = 1500;
    
    let failCounterDiv;
    let startupMsgDiv;
    
    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);
        
        reverb = new p5.Reverb();
        reverb.set(5, 3);
        melodicFilter = new p5.LowPass();
        melodicFilter.freq(2200);
        
        // Background noise source
        radioNoise = new p5.Noise('brown');
        radioNoise.amp(0.51);   // 15% quieter base
        masterGain = new p5.Gain();
        
        // Create band‑pass filters and gains for each band
        for (let [band, info] of Object.entries(bands)) {
            let bpFilter = new p5.BandPass();
            bpFilter.freq(info.freq);
            bpFilter.res(6);
            let gainNode = new p5.Gain();
            radioNoise.connect(bpFilter);
            bpFilter.connect(gainNode);
            gainNode.connect(masterGain);
            bandFilters[band] = bpFilter;
            bandGains[band] = gainNode;
            // set initial gain: active if that band is current and not all‑on
            gainNode.amp(info.active ? lastVolume : 0);
        }
        masterGain.connect();
        
        // Set initial solo mode (only C‑band active)
        setBandSolo("cband");
        
        radioVolumeSlider = select('#radioVolume');
        radioVolumeSlider.input(() => {
            lastVolume = parseFloat(radioVolumeSlider.value());
            updateAllGains();
        });
        
        // Band buttons – toggle individual bands on/off
        let bandBtns = selectAll('.band-btn');
        for (let btn of bandBtns) {
            btn.mousePressed(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
            });
            btn.touchStarted(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
                return false;
            });
        }
        
        // "All On" button – activate all bands simultaneously
        let allOnBtn = select('#allOnBtn');
        allOnBtn.mousePressed(() => {
            enableAllBands();
        });
        allOnBtn.touchStarted(() => {
            enableAllBands();
            return false;
        });
        
        failCounterDiv = select('#failCounter');
        updateFailDisplay();
        startupMsgDiv = select('#startupMsg');
        
        // Initialize wave points for visualization
        for (let i = 0; i <= width; i += 8) {
            wavePoints.push({x: i, y: height/2});
        }
        
        background(0);
    }
    
    function setBandSolo(band) {
        // Turn off all bands, then turn on only the selected one
        for (let b of Object.keys(bands)) {
            bands[b].active = false;
            bandGains[b].amp(0);
        }
        bands[band].active = true;
        bandGains[band].amp(lastVolume);
        currentBand = band;
        bandFreqDisplay = bands[band].freq;
        allOnMode = false;
        // Update button visuals
        for (let b of Object.keys(bands)) {
            let btn = select(`.band-btn[data-band="${b}"]`);
            if (b === band) {
                btn.removeClass('muted');
                btn.addClass('active');
            } else {
                btn.addClass('muted');
                btn.removeClass('active');
            }
        }
    }
    
    function enableAllBands() {
        allOnMode = true;
        for (let b of Object.keys(bands)) {
            bands[b].active = true;
            bandGains[b].amp(lastVolume);
            let btn = select(`.band-btn[data-band="${b}"]`);
            btn.removeClass('muted');
            btn.addClass('active');
        }
        // Visualization still shows the last selected band's frequency (or cycle)
        // But we can choose one for display (e.g., first)
        currentBand = "cband";
        bandFreqDisplay = bands.cband.freq;
    }
    
    function toggleBand(band) {
        if (allOnMode) {
            // If in all‑on mode, turning off one band exits all‑on mode and goes to solo mixed? Better: exit all‑on and set that band solo
            allOnMode = false;
            // Turn all gains to 0
            for (let b of Object.keys(bands)) {
                bandGains[b].amp(0);
                let btn = select(`.band-btn[data-band="${b}"]`);
                btn.addClass('muted');
                btn.removeClass('active');
            }
            // Then activate the clicked band
            bands[band].active = true;
            bandGains[band].amp(lastVolume);
            currentBand = band;
            bandFreqDisplay = bands[band].freq;
            let btn = select(`.band-btn[data-band="${band}"]`);
            btn.removeClass('muted');
            btn.addClass('active');
        } else {
            // Solo mode: toggle this band on/off
            let isActive = bands[band].active;
            if (isActive) {
                // Turn it off
                bands[band].active = false;
                bandGains[band].amp(0);
                let btn = select(`.band-btn[data-band="${band}"]`);
                btn.addClass('muted');
                btn.removeClass('active');
                // If no band left active, default to C‑band
                let anyActive = Object.values(bands).some(b => b.active);
                if (!anyActive) {
                    bands.cband.active = true;
                    bandGains.cband.amp(lastVolume);
                    currentBand = "cband";
                    bandFreqDisplay = bands.cband.freq;
                    let cbtn = select(`.band-btn[data-band="cband"]`);
                    cbtn.removeClass('muted');
                    cbtn.addClass('active');
                } else {
                    // Find the first active band for visualization
                    for (let b of Object.keys(bands)) {
                        if (bands[b].active) {
                            currentBand = b;
                            bandFreqDisplay = bands[b].freq;
                            break;
                        }
                    }
                }
            } else {
                // Turn it on
                bands[band].active = true;
                bandGains[band].amp(lastVolume);
                let btn = select(`.band-btn[data-band="${band}"]`);
                btn.removeClass('muted');
                btn.addClass('active');
                currentBand = band;
                bandFreqDisplay = bands[band].freq;
            }
        }
        updateAllGains();
    }
    
    function updateAllGains() {
        for (let b of Object.keys(bands)) {
            if (bands[b].active) {
                bandGains[b].amp(lastVolume);
            } else {
                bandGains[b].amp(0);
            }
        }
    }
    
    function startRadioBackground() {
        if (radioStarted) return;
        radioStarted = true;
        radioNoise.start();
        updateAllGains();
    }
    
    function dismissStartupMessage() {
        if (startupMsgDiv && startupMsgDiv.elt) {
            startupMsgDiv.style('opacity', '0');
            setTimeout(() => {
                if (startupMsgDiv && startupMsgDiv.elt) startupMsgDiv.remove();
            }, 1000);
        }
    }
    
    // Visualization 40% brighter (increase alpha and stroke brightness)
    function drawVisualization() {
        let freq = bandFreqDisplay;
        let amplitude = 55 + 20 * sin(frameCount * 0.015); // increased amplitude for brightness
        let phase = frameCount * (freq / 1800.0);
        for (let i = 0; i < wavePoints.length; i++) {
            let x = wavePoints[i].x;
            let y = height/2 + sin(x * freq / 7000.0 + phase) * amplitude + cos(x * freq / 11000.0) * (amplitude * 0.6);
            wavePoints[i].y = y;
        }
        
        let waveColor = bands[currentBand].active ? [154,252,151] : [100,100,100];
        let alphaMult = 1.4; // 40% brighter
        stroke(waveColor[0], waveColor[1], waveColor[2], constrain(255 * alphaMult, 0, 255));
        strokeWeight(1.2);    // slightly thicker for visibility
        noFill();
        beginShape();
        for (let p of wavePoints) vertex(p.x, p.y);
        endShape();
        
        fill(waveColor[0], waveColor[1], waveColor[2], 220);
        noStroke();
        textAlign(RIGHT, TOP);
        textSize(12);
        textFont('monospace');
        text(`${currentBand.toUpperCase()} ${bandFreqDisplay} Hz`, width - 20, 65);
        
        // Particles – now white (255)
        stroke(255, 220);
        strokeWeight(1.2);
        for (let i = 0; i < 45; i++) {
            let x = (frameCount * (freq / 1800) + i * 55) % width;
            let y = height/2 + sin(x * freq / 2800 + frameCount * 0.04) * 28;
            point(x, y);
        }
    }
    
    // Chorus intensity reduced by 20% (detune cents scaled)
    function playFeedbackTone(num) {
        let baseFreq = feedbackFreqs[num-1];
        if (!baseFreq) return;
        addFrequencyRipple(baseFreq);
        
        let volumeBoost = 1.35;
        let env = new p5.Envelope();
        env.setADSR(0.02, 0.15, 0.6, 1.2);
        env.setRange(0.22 * volumeBoost, 0);
        
        // Reduced detune: original [0,7,-5] -> scale 0.8 => [0,5.6,-4] (use 0,6,-4)
        let detunes = [0, 6, -4];  // approximately 20% less intensity
        let voices = [];
        for (let i = 0; i < detunes.length; i++) {
            let osc = new p5.Oscillator('sine');
            let cents = detunes[i];
            let freq = baseFreq * Math.pow(2, cents / 1200);
            osc.freq(freq);
            osc.start();
            env.play(osc);
            osc.disconnect();
            osc.connect(melodicFilter);
            voices.push(osc);
        }
        
        melodicFilter.disconnect();
        melodicFilter.connect(reverb);
        reverb.process(melodicFilter, 3.5, 2.5);
        
        let ampObj = new p5.Amplitude();
        ampObj.setInput(voices[0]);
        
        shapes.push({
            x: random(width),
            y: random(height),
            vx: random(-1.8, 1.8),
            vy: random(-2.2, -0.5),
            osc: voices[0],
            amp: ampObj,
            opacity: 200,
            extraOscs: voices.slice(1)
        });
        
        setTimeout(() => {
            for (let v of voices) v.stop();
            let idx = shapes.findIndex(s => s.osc === voices[0]);
            if (idx !== -1) shapes.splice(idx,1);
        }, 1800);
    }
    
    function addFrequencyRipple(noteFreq) {
        let ripple = {
            x: width/2,
            y: height/2,
            radius: 20,
            maxRadius: min(width,height) * 0.8,
            life: 255,
            freq: noteFreq
        };
        ripples.push(ripple);
    }
    
    function drawRipples() {
        for (let i = ripples.length-1; i >= 0; i--) {
            let r = ripples[i];
            r.radius += 6;
            r.life -= 5;
            if (r.radius > r.maxRadius || r.life <= 0) {
                ripples.splice(i,1);
                continue;
            }
            noFill();
            stroke(154,252,151, r.life);
            strokeWeight(1.2);
            circle(r.x, r.y, r.radius * 2);
            let innerRadius = r.radius * (r.freq / 300);
            stroke(255, 200, 100, r.life * 0.6);
            circle(r.x, r.y, innerRadius * 2);
        }
    }
    
    // Game logic
    function updateSpeed() {
        currentDelay = max(320, baseDelay - (speedLevel * 55));
    }
    
    function nextRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
    }
    
    function onCorrect() {
        playFeedbackTone(currentTarget);
        correctFlash = 110;
        waitingForInput = false;
        if (speedLevel < 18) speedLevel++;
        updateSpeed();
        if (feedbackTimer) clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
            if (gameActive) nextRound();
            feedbackTimer = null;
        }, currentDelay);
    }
    
    function onWrong() {
        failCount++;
        updateFailDisplay();
        correctFlash = 70;
        if (failCount >= 18) {
            gameOver();
            return;
        }
        waitingForInput = true;
    }
    
    function gameOver() {
        gameActive = false;
        waitingForInput = false;
        if (feedbackTimer) clearTimeout(feedbackTimer);
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.3);
            if (s.extraOscs) for (let o of s.extraOscs) o.amp(0,0.3);
        }
        shapes = [];
        ripples = [];
        failCounterDiv.html("failures 18/18 · lost");
    }
    
    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.3);
        }
        shapes = [];
        ripples = [];
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (feedbackTimer) clearTimeout(feedbackTimer);
    }
    
    function updateFailDisplay() {
        failCounterDiv.html("failures " + failCount + "/18");
    }
    
    function draw() {
        background(0);
        drawVisualization();
        drawRipples();
        
        for (let i = shapes.length-1; i >= 0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;
            let level = s.amp.getLevel();
            let ampScale = map(level, 0, 0.3, 0.6, 1.6);
            stroke(255);
            strokeWeight(1.3);
            fill(0, 0);
            circle(s.x, s.y, 24 * ampScale);
            noStroke();
            s.opacity -= 1.5;
            if (s.opacity <= 0) {
                if (s.osc) s.osc.amp(0, 0.8);
                shapes.splice(i,1);
            }
        }
        
        drawTargetDots();
        
        if (correctFlash > 0) {
            fill(255, 255, 255, correctFlash * 0.25);
            rect(0, 0, width, height);
            correctFlash -= 6;
        }
        
        if (!gameActive) {
            fill(255, 255, 255);
            textAlign(CENTER, CENTER);
            textSize(20);
            textFont('monospace');
            text("signal lost", width/2, height/2);
        }
    }
    
    function drawTargetDots() {
        if (!gameActive) return;
        let dotDiameter = 28;
        let spacing = 50;
        let total = currentTarget;
        let startX = width/2 - (total-1) * spacing / 2;
        let yPos = height/2;
        for (let i = 0; i < total; i++) {
            fill(255, 220);
            noStroke();
            circle(startX + i * spacing, yPos, dotDiameter);
            fill(255, 80);
            circle(startX + i * spacing, yPos, dotDiameter * 0.3);
        }
        fill(160, 160, 160, 200);
        textSize(10);
        textAlign(CENTER, BOTTOM);
        textFont('monospace');
        text("speed: " + (speedLevel + 1), width/2, height/2 - 48);
    }
    
    function handleNumberPress(num) {
        dismissStartupMessage();
        userStartAudio().then(() => {
            if (!radioStarted) startRadioBackground();
        }).catch(() => { if (!radioStarted) startRadioBackground(); });
        if (!radioStarted) startRadioBackground();
        
        if (!gameActive) {
            startGame();
            setTimeout(() => {
                if (gameActive && waitingForInput) {
                    if (num === currentTarget) onCorrect();
                    else onWrong();
                }
            }, 50);
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) onCorrect();
        else onWrong();
    }
    
    function keyPressed() {
        let k = key;
        if (['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        if (!gameActive && ['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        return false;
    }
    
    function touchStarted() {
        userStartAudio().catch(()=>{});
        return false;
    }
    
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
        wavePoints = [];
        for (let i = 0; i <= width; i += 8) wavePoints.push({x: i, y: height/2});
    }
</script>
</body>
</html>
