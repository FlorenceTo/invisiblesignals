<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Radio Signal Game | Invisible Signals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', monospace;
            touch-action: pan-x pan-y;
        }
        /* header row – all controls in one line */
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 60px;
            pointer-events: auto;
        }
        .band-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .band-btn {
            background: rgba(30,30,40,0.8);
            border: 1px solid #9afc97;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #eee;
            cursor: pointer;
            transition: 0.1s;
        }
        .band-btn.active {
            background: #9afc9722;
            border-color: #9afc97;
            color: #9afc97;
        }
        .band-btn.muted {
            background: rgba(30,30,40,0.5);
            border-color: #ff8888;
            color: #ff8888;
            text-decoration: line-through;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
        }
        .volume-control span {
            font-size: 11px;
            color: #9afc97;
            font-family: monospace;
        }
        input[type="range"] {
            width: 90px;
            background: #9afc97;
            height: 3px;
            border-radius: 3px;
            -webkit-appearance: none;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #9afc97;
            cursor: pointer;
        }
        .fail-counter {
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff0000;
            border: 1px solid #ff0000;
            white-space: nowrap;
        }
        .back-link {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            border: 1px solid #9afc97;
            transition: 0.2s;
        }
        .instruction {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        .startup-message {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 40px;
            color: #ffffff;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #ffffff;
            max-width: 85%;
            transition: opacity 1s ease;
            white-space: nowrap;
        }
        @media (max-width: 640px) {
            .band-btn { font-size: 9px; padding: 4px 8px; }
            .volume-control input { width: 70px; }
            .fail-counter { font-size: 9px; padding: 4px 8px; }
            .startup-message { font-size: 11px; white-space: normal; width: 90%; padding: 12px 16px; top: 20%; }
        }
        @media (max-width: 480px) {
            .startup-message { font-size: 10px; top: 18%; }
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="band-buttons" id="bandButtons">
        <button class="band-btn" data-band="cband" data-freq="600">C‑band (600 Hz)</button>
        <button class="band-btn" data-band="kuband" data-freq="1800">Ku‑band (1800 Hz)</button>
        <button class="band-btn" data-band="lband" data-freq="350">L‑band (350 Hz)</button>
        <button class="band-btn" data-band="kaband" data-freq="5000">Ka‑band (5000 Hz)</button>
        <button class="band-btn" data-band="xband" data-freq="1000">X‑band (1000 Hz)</button>
    </div>
    <div class="volume-control">
        <span>vol</span>
        <input type="range" id="radioVolume" min="0" max="1" step="0.01" value="0.28">
    </div>
    <div class="fail-counter" id="failCounter">failures 0/18</div>
</div>
<a href="index.html" class="back-link">← radio</a>
<div class="instruction">press keys 1 2 3 4 5 6 7 → match dots</div>
<div id="startupMsg" class="startup-message">Use Firefox browser for best experience<br>press 1 to start</div>

<script>
    // ================================================================
    // RADIO SIGNAL GAME – keyboard only, band toggles,
    // generative frequency visualization, smooth envelope.
    // ================================================================

    let shapes = [];
    let reverb, melodicFilter;
    
    // Just intonation feedback tones (mellow)
    const feedbackFreqs = [110.00, 123.75, 132.00, 137.50, 146.67, 154.66, 165.00];
    
    // Background radio noise
    let radioNoise;
    let radioBandFilter;
    let radioGain;
    let radioVolumeSlider;
    let currentBand = "cband";
    let radioStarted = false;
    let bandMuted = {
        cband: false,
        kuband: false,
        lband: false,
        kaband: false,
        xband: false
    };
    let lastVolume = 0.28;
    
    // Visualization variables
    let wavePoints = [];
    let bandFreqDisplay = 600;
    let timeOffset = 0;
    
    // Game state
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let feedbackTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;
    let baseDelay = 1500;
    let currentDelay = 1500;
    
    let failCounterDiv;
    let startupMsgDiv;
    
    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);
        
        // reverb and filter for melodic feedback
        reverb = new p5.Reverb();
        reverb.set(3.5, 2);
        melodicFilter = new p5.LowPass();
        melodicFilter.freq(1800);
        
        // Background radio (brown noise + bandpass)
        radioNoise = new p5.Noise('brown');
        radioBandFilter = new p5.BandPass();
        radioBandFilter.res(6);
        radioGain = new p5.Gain();
        radioNoise.disconnect();
        radioNoise.connect(radioBandFilter);
        radioBandFilter.connect(radioGain);
        radioGain.connect();
        
        setBand("cband");
        radioNoise.amp(0.6);
        radioGain.amp(0.28);
        lastVolume = 0.28;
        
        radioVolumeSlider = select('#radioVolume');
        radioVolumeSlider.input(() => {
            let vol = parseFloat(radioVolumeSlider.value());
            radioGain.amp(vol);
            lastVolume = vol;
        });
        
        // Band buttons – toggle on/off (first click on, second click off)
        let bandBtns = selectAll('.band-btn');
        for (let btn of bandBtns) {
            btn.mousePressed(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
            });
            btn.touchStarted(() => {
                let band = btn.attribute('data-band');
                toggleBand(band);
                return false;
            });
        }
        
        failCounterDiv = select('#failCounter');
        updateFailDisplay();
        
        startupMsgDiv = select('#startupMsg');
        
        // Initialize wave points for visualization
        for (let i = 0; i <= width; i += 8) {
            wavePoints.push({x: i, y: height/2});
        }
        
        background(0);
    }
    
    function toggleBand(band) {
        // If band is currently active (playing), mute it; otherwise unmute and set as active
        let isCurrentlyMuted = bandMuted[band];
        if (isCurrentlyMuted) {
            // unmute
            bandMuted[band] = false;
            // if this band becomes the current active band, update filter
            if (currentBand === band) {
                setBand(band);
                radioGain.amp(lastVolume);
            }
        } else {
            // mute
            bandMuted[band] = true;
            if (currentBand === band) {
                radioGain.amp(0);
            }
        }
        // Update button appearance
        let btn = select(`.band-btn[data-band="${band}"]`);
        if (bandMuted[band]) {
            btn.addClass('muted');
        } else {
            btn.removeClass('muted');
        }
        // If we unmuted and it's not the current band, we don't auto-switch – user must click again to select
        // But we also allow switching bands by clicking again? The original behavior: clicking a band selects it.
        // Let's implement: if band is muted and we click, unmute and activate it. If band is active and not muted, muting turns it off.
        // Also, if band is not muted and it's not the current band, we should switch to it.
        if (!bandMuted[band] && currentBand !== band) {
            // Switch to this band
            setBand(band);
            radioGain.amp(lastVolume);
        }
        // Update active visual highlight
        for (let b of selectAll('.band-btn')) {
            let bband = b.attribute('data-band');
            if (bband === band && !bandMuted[band]) {
                b.addClass('active');
            } else if (bband !== band) {
                b.removeClass('active');
            }
        }
        if (bandMuted[band]) {
            btn.removeClass('active');
        } else {
            btn.addClass('active');
        }
    }
    
    function setBand(band) {
        currentBand = band;
        let freqHz;
        switch(band) {
            case "cband":  freqHz = 600; break;
            case "kuband": freqHz = 1800; break;
            case "lband":  freqHz = 350; break;
            case "kaband": freqHz = 5000; break;
            case "xband":  freqHz = 1000; break;
            default: freqHz = 600;
        }
        bandFreqDisplay = freqHz;
        if (radioBandFilter && !bandMuted[band]) {
            radioBandFilter.freq(freqHz);
        } else if (bandMuted[band]) {
            radioBandFilter.freq(freqHz); // still set but gain is 0
        } else {
            radioBandFilter.freq(freqHz);
        }
    }
    
    function startRadioBackground() {
        if (radioStarted) return;
        radioStarted = true;
        radioNoise.start();
        if (!bandMuted[currentBand]) radioGain.amp(lastVolume);
        else radioGain.amp(0);
    }
    
    function dismissStartupMessage() {
        if (startupMsgDiv && startupMsgDiv.elt) {
            startupMsgDiv.style('opacity', '0');
            setTimeout(() => {
                if (startupMsgDiv && startupMsgDiv.elt) startupMsgDiv.remove();
            }, 1000);
        }
    }
    
    // ----- Generative frequency visualization (waveform based on band freq) -----
    function drawVisualization() {
        // Update wave shape based on band frequency
        let freq = bandFreqDisplay;
        let amplitude = 40 + 20 * sin(frameCount * 0.02); // subtle breathing
        let phase = frameCount * (freq / 2000.0); // speed relates to frequency
        
        for (let i = 0; i < wavePoints.length; i++) {
            let x = wavePoints[i].x;
            // More precise: using sine wave with frequency component
            let y = height/2 + sin(x * freq / 8000.0 + phase) * amplitude + cos(x * freq / 12000.0) * (amplitude * 0.5);
            wavePoints[i].y = y;
        }
        
        // Draw the waveform
        stroke(154, 252, 151, 100);
        strokeWeight(2);
        noFill();
        beginShape();
        for (let p of wavePoints) {
            vertex(p.x, p.y);
        }
        endShape();
        
        // Draw frequency label
        fill(154, 252, 151, 180);
        noStroke();
        textAlign(RIGHT, TOP);
        textSize(12);
        textFont('monospace');
        text(`${currentBand.toUpperCase()} ${bandFreqDisplay} Hz`, width - 20, 60);
        
        // Draw small particles that move with frequency (generative)
        stroke(255, 200);
        strokeWeight(1.5);
        for (let i = 0; i < 30; i++) {
            let x = (frameCount * (freq / 2000) + i * 70) % width;
            let y = height/2 + sin(x * freq / 3000 + frameCount * 0.05) * 25;
            point(x, y);
        }
    }
    
    // ----- visual: floating white outline circles (no trails) -----
    function draw() {
        background(0);
        
        // Draw generative frequency visualization first
        drawVisualization();
        
        // Draw floating circles from key presses
        for (let i = shapes.length-1; i >= 0; i--) {
            let s = shapes[i];
            s.x += s.vx;
            s.y += s.vy;
            
            let level = s.amp.getLevel();
            let ampScale = map(level, 0, 0.3, 0.6, 1.6);
            
            stroke(255);
            strokeWeight(1.3);
            fill(0, 0);
            circle(s.x, s.y, 24 * ampScale);
            noStroke();
            
            s.opacity -= 1.5;
            if (s.opacity <= 0) {
                if (s.osc) s.osc.amp(0, 1.0);
                setTimeout(() => { if(s.osc) s.osc.stop(); }, 1000);
                shapes.splice(i,1);
            }
        }
        
        drawTargetDots();
        
        if (correctFlash > 0) {
            fill(255, 255, 255, correctFlash * 0.3);
            rect(0, 0, width, height);
            correctFlash -= 7;
        }
        
        if (!gameActive) {
            fill(200, 200, 200, 220);
            textAlign(CENTER, CENTER);
            textSize(22);
            textFont('monospace');
            text("signal lost", width/2, height/2 - 40);
            textSize(12);
            text("press a number key (1-7) to restart", width/2, height/2 + 20);
        }
    }
    
    function drawTargetDots() {
        if (!gameActive) return;
        let dotDiameter = 30;
        let spacing = 52;
        let total = currentTarget;
        let startX = width/2 - (total-1) * spacing / 2;
        let yPos = height/2;
        
        for (let i = 0; i < total; i++) {
            fill(255, 230);
            noStroke();
            circle(startX + i * spacing, yPos, dotDiameter);
            fill(255, 90);
            circle(startX + i * spacing, yPos, dotDiameter * 0.3);
        }
        
        fill(150, 150, 150, 180);
        textSize(10);
        textAlign(CENTER, BOTTOM);
        text("speed: " + (speedLevel + 1), width/2, height/2 - 48);
    }
    
    // Smooth sound envelope to eliminate click at end
    function playFeedbackTone(num) {
        let freq = feedbackFreqs[num-1];
        if (!freq) return;
        
        let osc = new p5.Oscillator('sine');
        let env = new p5.Envelope();
        env.setADSR(0.01, 0.1, 0.5, 0.4);
        env.setRange(0.28, 0);
        
        osc.freq(freq);
        osc.start();
        env.play(osc);
        
        osc.freq(freq * (1 + random(-0.003, 0.003)));
        osc.disconnect();
        osc.connect(melodicFilter);
        reverb.process(melodicFilter, 2.2, 1.8);
        
        let ampObj = new p5.Amplitude();
        ampObj.setInput(osc);
        
        shapes.push({
            x: random(width),
            y: random(height),
            vx: random(-1.8, 1.8),
            vy: random(-2.2, -0.5),
            osc: osc,
            amp: ampObj,
            opacity: 200
        });
        
        // Schedule stop after envelope finishes
        setTimeout(() => {
            if (osc) osc.stop();
        }, 800);
    }
    
    // game logic
    function updateSpeed() {
        currentDelay = max(320, baseDelay - (speedLevel * 55));
    }
    
    function nextRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
    }
    
    function onCorrect() {
        playFeedbackTone(currentTarget);
        correctFlash = 110;
        waitingForInput = false;
        if (speedLevel < 18) speedLevel++;
        updateSpeed();
        if (feedbackTimer) clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
            if (gameActive) nextRound();
            feedbackTimer = null;
        }, currentDelay);
    }
    
    function onWrong() {
        failCount++;
        updateFailDisplay();
        correctFlash = 70;
        if (failCount >= 18) {
            gameOver();
            return;
        }
        waitingForInput = true;
    }
    
    function gameOver() {
        gameActive = false;
        waitingForInput = false;
        if (feedbackTimer) clearTimeout(feedbackTimer);
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.4);
        }
        shapes = [];
        failCounterDiv.html("failures 18/18 · lost");
    }
    
    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        for (let s of shapes) {
            if (s.osc) s.osc.amp(0, 0.3);
        }
        shapes = [];
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (feedbackTimer) clearTimeout(feedbackTimer);
    }
    
    function updateFailDisplay() {
        failCounterDiv.html("failures " + failCount + "/18");
        if (failCount >= 15) failCounterDiv.style('border-color', '#ff0000');
        else failCounterDiv.style('border-color', '#ff0000');
    }
    
    function handleNumberPress(num) {
        dismissStartupMessage();
        
        userStartAudio().then(() => {
            if (!radioStarted) startRadioBackground();
        }).catch(() => {
            if (!radioStarted) startRadioBackground();
        });
        if (!radioStarted) startRadioBackground();
        
        if (!gameActive) {
            startGame();
            setTimeout(() => {
                if (gameActive && waitingForInput) {
                    if (num === currentTarget) onCorrect();
                    else onWrong();
                }
            }, 50);
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) onCorrect();
        else onWrong();
    }
    
    function keyPressed() {
        let k = key;
        if (['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        if (!gameActive && ['1','2','3','4','5','6','7'].includes(k)) {
            handleNumberPress(parseInt(k,10));
            return false;
        }
        return false;
    }
    
    function touchStarted() {
        userStartAudio().catch(()=>{});
        return false;
    }
    
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
        // Reinitialize wave points
        wavePoints = [];
        for (let i = 0; i <= width; i += 8) {
            wavePoints.push({x: i, y: height/2});
        }
    }
</script>
</body>
</html>
