<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Invisible Signals | Wave Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: pan-x pan-y;
        }
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 60px;
            pointer-events: auto;
            font-family: monospace;
        }
        .band-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .band-btn {
            background: rgba(30,30,40,0.8);
            border: 1px solid #ff4444;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff8888;
            cursor: pointer;
            transition: 0.1s;
        }
        .band-btn.active {
            background: #9afc9722;
            border-color: #9afc97;
            color: #9afc97;
        }
        .fail-counter {
            background: rgba(30,30,40,0.8);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 11px;
            font-family: monospace;
            color: #ff0000;
            border: 1px solid #ff0000;
            white-space: nowrap;
        }
        .back-link {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: transparent;
            padding: 6px 0;
            font-size: 12px;
            text-decoration: none;
            color: #9afc97;
            font-family: monospace;
            z-index: 30;
            transition: opacity 0.2s;
        }
        .instruction {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ccc;
            pointer-events: none;
            z-index: 25;
        }
        .startup-message {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 40px;
            color: #ffffff;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #ffffff;
            max-width: 85%;
            transition: opacity 1s ease;
            white-space: nowrap;
        }
        @media (max-width: 640px) {
            .band-btn { font-size: 9px; padding: 4px 8px; }
            .fail-counter { font-size: 9px; padding: 4px 8px; }
            .startup-message { font-size: 11px; white-space: normal; width: 90%; padding: 12px 16px; top: 20%; }
        }
        @media (max-width: 480px) {
            .startup-message { font-size: 10px; top: 18%; }
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="band-buttons" id="bandButtons">
        <button class="band-btn active" data-band="c">C (261 Hz)</button>
        <button class="band-btn" data-band="db">D♭ (277 Hz)</button>
        <button class="band-btn" data-band="e">E (329 Hz)</button>
        <button class="band-btn" data-band="f">F♯ (369 Hz)</button>
        <button class="band-btn" data-band="g">G♯ (415 Hz)</button>
        <button class="band-btn" data-band="a">A♯ (466 Hz)</button>
        <button class="band-btn" data-band="b">B (493 Hz)</button>
    </div>
    <div class="fail-counter" id="failCounter">failures 0/18</div>
</div>
<a href="index.html" class="back-link">← radio</a>
<div class="instruction">press 1‑7 to match dots</div>
<div id="startupMsg" class="startup-message">for best performance use Firefox<br>press 1 to start</div>

<script>
    // ================================================================
    // FINAL RELIABLE GAME
    // - No continuous background sound
    // - Band buttons toggle visual waveforms only (enigmatic scale frequencies)
    // - Pressing a number plays a short sine tone: a minor third interval (6:5)
    //   above the selected band's root frequency (or A=440 if no band active)
    // - Game: match dots, correct = note + visual flash, wrong = failure
    // ================================================================

    let ripples = [];
    let audioStarted = false;
    let reverb;

    // Band frequencies (enigmatic scale from C)
    const bandFreqs = {
        c: 261.63,
        db: 277.18,
        e: 329.63,
        f: 369.99,
        g: 415.30,
        a: 466.16,
        b: 493.88
    };
    let bandActive = {
        c: true,
        db: false,
        e: false,
        f: false,
        g: false,
        a: false,
        b: false
    };
    let bandNames = ['c', 'db', 'e', 'f', 'g', 'a', 'b'];
    let bandDisplay = { c:'C', db:'D♭', e:'E', f:'F♯', g:'G♯', a:'A♯', b:'B' };

    // Visual waveform storage per band
    let wavePoints = {};

    // Game state
    let gameActive = false;
    let currentTarget = 1;
    let waitingForInput = true;
    let roundTimer = null;
    let correctFlash = 0;
    let failCount = 0;
    let speedLevel = 0;
    let baseDelay = 1500;
    let currentDelay = 1500;

    let failCounterDiv, startupMsgDiv;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        frameRate(60);

        // Reverb for the short melodic notes (only used when number is pressed)
        reverb = new p5.Reverb();
        reverb.set(3, 2);

        // Initialize waveform points for each band
        for (let band of bandNames) {
            wavePoints[band] = [];
            for (let i = 0; i <= width; i += 8) {
                wavePoints[band].push({x: i, y: height/2});
            }
        }

        // Create band toggle buttons
        let container = select('#bandButtons');
        let btns = selectAll('.band-btn');
        for (let btn of btns) {
            let band = btn.attribute('data-band');
            btn.mousePressed(() => toggleBand(band));
            btn.touchStarted(() => { toggleBand(band); return false; });
            if (bandActive[band]) btn.addClass('active');
            else btn.addClass('muted');
        }

        failCounterDiv = select('#failCounter');
        startupMsgDiv = select('#startupMsg');
        updateFailDisplay();
        background(0);
    }

    // Toggle band visualisation only (no sound)
    function toggleBand(band) {
        bandActive[band] = !bandActive[band];
        let btn = select(`.band-btn[data-band="${band}"]`);
        if (bandActive[band]) {
            btn.addClass('active');
            btn.removeClass('muted');
        } else {
            btn.removeClass('active');
            btn.addClass('muted');
        }
    }

    function startAudio() {
        if (audioStarted) return;
        userStartAudio().then(() => {
            audioStarted = true;
        }).catch(e => console.log(e));
    }

    function dismissStartupMessage() {
        if (startupMsgDiv && startupMsgDiv.elt) {
            startupMsgDiv.style('opacity', '0');
            setTimeout(() => startupMsgDiv.remove(), 1000);
        }
    }

    // Play a short melodic note: root frequency is A=440 Hz,
    // but we can use the frequency of the first active band as root, or just 440.
    // For a third interval, we play two notes: root and a minor third above (6:5).
    // To keep it simple and pleasant, we'll play a single sine tone that is the minor third
    // above a base frequency (base = 440). For each number press, we also add a ripple.
    function playThirdInterval() {
        let base = 440.0;
        let minorThirdRatio = 6/5;   // 1.2 -> 528 Hz
        let freq = base * minorThirdRatio;
        let env = new p5.Envelope();
        env.setADSR(0.01, 0.1, 0.4, 0.3);
        env.setRange(0.2, 0);
        let osc = new p5.Oscillator('sine');
        osc.freq(freq);
        osc.start();
        env.play(osc);
        // Connect to reverb for a more atmospheric feel
        osc.disconnect();
        osc.connect(reverb);
        setTimeout(() => { osc.stop(); }, 500);
        // Visual ripple
        ripples.push({
            x: width/2, y: height/2, radius: 20,
            maxRadius: min(width,height)*0.5, life: 180,
            freq: freq
        });
    }

    // For wrong answer, play a lower, dissonant interval (tritone? just a semitone down)
    function playWrongNote() {
        let base = 440.0;
        let freq = base * 0.943874; // minor second below (about 415 Hz)
        let env = new p5.Envelope();
        env.setADSR(0.01, 0.1, 0.3, 0.2);
        env.setRange(0.15, 0);
        let osc = new p5.Oscillator('triangle');
        osc.freq(freq);
        osc.start();
        env.play(osc);
        osc.disconnect();
        osc.connect(reverb);
        setTimeout(() => { osc.stop(); }, 400);
        ripples.push({
            x: width/2, y: height/2, radius: 10,
            maxRadius: min(width,height)*0.4, life: 120,
            freq: freq
        });
    }

    // Draw all waveforms for active bands (semi‑transparent, stacked)
    function drawWaveforms() {
        let t = frameCount;
        for (let band of bandNames) {
            if (!bandActive[band]) continue;
            let freq = bandFreqs[band];
            let amplitude = 35 + 8 * sin(t * 0.015);
            let phase = t * (freq / 1800.0);
            let points = wavePoints[band];
            for (let i = 0; i < points.length; i++) {
                let x = points[i].x;
                let y = height/2 + sin(x * freq / 7000.0 + phase) * amplitude + cos(x * freq / 11000.0) * (amplitude * 0.5);
                points[i].y = y;
            }
            stroke(154, 252, 151, 100);
            strokeWeight(1.0);
            noFill();
            beginShape();
            for (let p of points) vertex(p.x, p.y);
            endShape();
        }
        // floating particles
        stroke(255, 180);
        strokeWeight(1);
        for (let i = 0; i < 40; i++) {
            let x = (t * 0.8 + i * 70) % width;
            let y = height/2 + sin(x * 0.01 + t * 0.05) * 30;
            point(x, y);
        }
        let activeCount = bandNames.filter(b => bandActive[b]).length;
        fill(200,200,200,150);
        noStroke();
        textAlign(LEFT, TOP);
        textSize(10);
        textFont('monospace');
        text(`active waves: ${activeCount}`, 15, 65);
    }

    function drawRipples() {
        for (let i=ripples.length-1; i>=0; i--) {
            let r = ripples[i];
            r.radius += 5;
            r.life -= 8;
            if (r.radius > r.maxRadius || r.life <= 0) {
                ripples.splice(i,1);
                continue;
            }
            noFill();
            stroke(154,252,151, r.life);
            strokeWeight(1.2);
            circle(r.x, r.y, r.radius*2);
            let inner = r.radius * (r.freq/400);
            stroke(255,200,100, r.life*0.6);
            circle(r.x, r.y, inner*2);
        }
    }

    // Game logic
    function newRound() {
        if (!gameActive) return;
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
    }

    function correct() {
        playThirdInterval();
        correctFlash = 110;
        waitingForInput = false;
        if (speedLevel < 18) speedLevel++;
        currentDelay = max(320, baseDelay - speedLevel * 55);
        if (roundTimer) clearTimeout(roundTimer);
        roundTimer = setTimeout(() => {
            if (gameActive) newRound();
        }, currentDelay);
    }

    function wrong() {
        playWrongNote();
        failCount++;
        updateFailDisplay();
        correctFlash = 70;
        if (failCount >= 18) {
            gameActive = false;
            if (roundTimer) clearTimeout(roundTimer);
            failCounterDiv.html("failures 18/18 · lost");
        } else {
            waitingForInput = true;
        }
    }

    function startGame() {
        gameActive = true;
        failCount = 0;
        speedLevel = 0;
        currentDelay = baseDelay;
        updateFailDisplay();
        currentTarget = floor(random(1, 8));
        waitingForInput = true;
        if (roundTimer) clearTimeout(roundTimer);
    }

    function updateFailDisplay() {
        failCounterDiv.html("failures " + failCount + "/18");
    }

    function handleNumber(num) {
        dismissStartupMessage();
        startAudio();  // ensures audio context on first press
        if (!gameActive) {
            startGame();
            setTimeout(() => {
                if (gameActive && waitingForInput) {
                    if (num === currentTarget) correct();
                    else wrong();
                }
            }, 30);
            return;
        }
        if (!waitingForInput) return;
        if (num === currentTarget) correct();
        else wrong();
    }

    function drawTargetDots() {
        if (!gameActive) return;
        let dia = 28, spc = 50, total = currentTarget;
        let startX = width/2 - (total-1)*spc/2;
        for (let i=0; i<total; i++) {
            fill(255,220);
            noStroke();
            circle(startX + i*spc, height/2, dia);
            fill(255,80);
            circle(startX + i*spc, height/2, dia*0.3);
        }
        fill(160,160,160,200);
        textSize(10);
        textAlign(CENTER,BOTTOM);
        textFont('monospace');
        text("speed: " + (speedLevel+1), width/2, height/2-48);
    }

    function draw() {
        background(0);
        drawWaveforms();
        drawRipples();
        drawTargetDots();
        if (correctFlash > 0) {
            fill(255,255,255, correctFlash*0.25);
            rect(0,0,width,height);
            correctFlash -= 6;
        }
        if (!gameActive && audioStarted) {
            fill(255,255,255);
            textAlign(CENTER,CENTER);
            textSize(20);
            textFont('monospace');
            text("signal lost", width/2, height/2);
        }
    }

    function keyPressed() {
        let k = key;
        if (k >= '1' && k <= '7') {
            handleNumber(parseInt(k,10));
            return false;
        }
        return false;
    }

    function touchStarted() {
        startAudio();
        return false;
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
        for (let band of bandNames) {
            let newPoints = [];
            for (let i=0; i<=width; i+=8) newPoints.push({x:i, y:height/2});
            wavePoints[band] = newPoints;
        }
    }
</script>
</body>
</html>
